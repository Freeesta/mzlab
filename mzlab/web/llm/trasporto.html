<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Assistant transport</title>
<link rel="icon" href="data:,">
<style>
  :root { --fg: #1a1a1a; --bg: #ffffff; --line: #8a8a8a; --accent: #005a9c; --ok: #1b6e3c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg: #ececec; --bg: #1b1b1b; --line: #8a8a8a; --accent: #7cc0ff; --ok: #6fd39a; } }
  :root[data-theme="dark"] { --fg: #ececec; --bg: #1b1b1b; --line: #8a8a8a; --accent: #7cc0ff; --ok: #6fd39a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { padding: 4px 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  input[type="password"] { flex: 1 1 14em; min-height: 32px; padding: 2px 6px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
  button { min-height: 32px; min-width: 32px; padding: 2px 10px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  input[type="checkbox"] { width: 24px; height: 24px; }
  #hint { margin: 2px 0; color: var(--fg); opacity: .85; font-size: 12px; }
  #state { color: var(--ok); font-weight: 600; }
  @media (pointer: coarse) { button, input[type="password"] { min-height: 40px; } input[type="checkbox"] { width: 40px; height: 40px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<form id="f" autocomplete="off" onsubmit="return false">
  <div class="row"><label id="l-key"><span id="t-key"></span> <input id="key" type="password" autocomplete="off" spellcheck="false"></label>
    <button id="b-use" type="button"></button><button id="b-forget" type="button"></button></div>
  <div class="row"><label><input id="remember" type="checkbox"><span id="t-remember"></span></label></div>
  <p id="hint"></p>
  <p id="state" role="status" aria-live="polite"></p>
</form>
<script src="trasporto.js"></script>
</body></html>
