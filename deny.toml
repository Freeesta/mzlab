# cargo-deny: known advisories and allowed licences (job `deny` of .github/workflows/rust.yml for licences and sources, daily job of .github/workflows/advisories.yml for advisories).
[advisories]
version = 2
yanked = "warn"
# Unmaintained (not a vulnerability) and compile-time only: reached through the gtk3 bindings of Tauri on Linux, no safe upgrade exists.
# Remove it when Tauri moves to a maintained macro crate.
ignore = ["RUSTSEC-2024-0370"]

[licenses]
version = 2
# MIT, Apache-2.0, BSD, MPL-2.0, ISC, Unicode, Zlib and OFL for code and fonts; CDLA-Permissive-2.0 for the root certificates data (webpki-roots); CC0 and CC BY are for data only.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
