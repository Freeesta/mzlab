[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mzlab"
version = "1.0.0"
description = "mzLab: viewer for triple quadrupole and HRMS mzML data, runs in the browser (teaching lab, environmental pollutants)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[project.optional-dependencies]
# jsonschema: only the test of the step descriptors (tests/test_step_descrittori.py); pillow: the e2e that read screenshots (e2e_header, e2e_pulsanti, ...),
# also when the changed-files job picks them; lxml: the second, strict XML parser of every converted fixture (tests/test_mzml_secondo_parser.py);
# never in the site
test = ["pytest", "jsonschema>=4.18", "pillow", "lxml>=5"]
# only to regenerate tests/golden/librerie/ with tools/parita_librerie.py (not needed by the tests or the site)
parita = ["ms_entropy>=1.5", "matchms>=0.33"]

[tool.setuptools.packages.find]
include = ["mzlab*"]

[tool.setuptools.package-data]
"mzlab.chem" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
