[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mzlab"
version = "1.0.1"
description = "mzLab: viewer for triple quadrupole and HRMS mzML data, runs in the browser (teaching lab, environmental pollutants)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[project.optional-dependencies]
# jsonschema: only the test of the step descriptors (tests/test_step_descrittori.py); never in the site
test = ["pytest", "jsonschema>=4.18"]
# solo per rigenerare tests/golden/librerie/ con tools/parita_librerie.py (non servono ai test né al sito)
parita = ["ms_entropy>=1.5", "matchms>=0.33"]

[tool.setuptools.packages.find]
include = ["mzlab*"]

[tool.setuptools.package-data]
"mzlab.chem" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
