name: Bug
description: Something does not work or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach laboratory or personal data** (mzML, wiff, raw files, screenshots with names). Describe the problem in words or use the example files.
        Support is best effort, with no guaranteed response time.
  - type: textarea
    id: cosa
    attributes:
      label: What happens
      description: Steps to reproduce, what you expected and what happened.
    validations:
      required: true
  - type: dropdown
    id: dove
    attributes:
      label: Where you use it
      options:
        - Site in the browser
        - Desktop app
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Browser and system
      description: For example "Chrome 130, Windows 11".
    validations:
      required: true
  - type: checkboxes
    id: dati
    attributes:
      label: Confirmation
      options:
        - label: I have not attached laboratory or personal data.
          required: true
