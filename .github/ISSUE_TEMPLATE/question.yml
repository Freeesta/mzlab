name: Question or request
description: A usage question, course dates (for the version freeze) or a request.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach laboratory or personal data.**
        First read the [guides](https://github.com/Freeesta/mzlab/tree/main/docs/users). Best-effort support.
  - type: textarea
    id: testo
    attributes:
      label: Your question
    validations:
      required: true
  - type: checkboxes
    id: dati
    attributes:
      label: Confirmation
      options:
        - label: I have not attached laboratory or personal data.
          required: true
