# Coverage-guided fuzzing of the file parsers (fuzz/, cargo-fuzz): by hand (Actions > fuzz > Run workflow) and once a week. NOT a required check of main.
# A crash uploads its input as an artifact: it goes into fuzz/regressioni/<target>/ with the fix (docs/agenti/test.md).
name: fuzz

on:
  schedule:
    - cron: "43 3 * * 0"   # 03:43 UTC, every Sunday
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [ole, xmltree_methodinfo, mzmlhead, idxread, raw, wiff, mzlib_msp_mgf, lettori_aperti, lettori_andi, lettori_thermo, lettori_agilent, lettori_sciex, lettori_waters, lettori_shimadzu, lettori_bruker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # libFuzzer needs the nightly compiler; the stable one of the repository stays pinned by rust-toolchain.toml
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Seeds from the synthetic files
        run: sh fuzz/semi.sh
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || '300' }} -rss_limit_mb=2048 -timeout=20
      - name: Crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
