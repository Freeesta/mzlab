# Level 2 of the tests (CLAUDE.md): quick checks on every pull request and on every push to main (goal < 6 min).
# Unit tests on Linux (Python 3.11 shards; the required `pytest (ubuntu-latest, 3.14)` name is a gate, 3.14 really runs only in notte.yml), JavaScript syntax, the e2e smoke tests on Chromium.
# The rest (Mac, Windows, Firefox, WebKit and all the e2e) runs once a day on main: notte.yml.
name: test

# No paths-ignore: these 4 jobs are the required checks of the "main protetto" ruleset, so they must run on every pull request.
# A pull request that changes ONLY documents (tools/ci_solo_doc.py) skips the Rust/wasm toolchain, runs a few document tests and no e2e; the jobs stay green for the ruleset.
# Any other file, even one, runs everything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push stops the run still going on the same pull request; a push to main has a group of its own (run_id), because a run waiting in a shared group is replaced
# by the next one even without cancel-in-progress, and the cache of the run that is lost is never saved
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # main: every commit keeps its own result

jobs:
  # Builds once what most tests build in every shard (tools/ci_prebuilt.py): mzlab-cli, the examples and the .wasm of the crates, in three parallel groups. The shards wait for it and set
  # MZLAB_PREBUILT (tests/cargo_util.py installs the file instead of running cargo). NOT a required check: if it fails the shards build for themselves, as before. Caches are restored, never saved.
  prebuilt:
    name: prebuilt (${{ matrix.parte }})
    strategy:
      fail-fast: false
      matrix:
        parte: [native, wasm-a, wasm-b]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # tools/ci_base.py: a pull request diffs its merge commit with its first parent
      - id: solo
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(python3 tools/ci_base.py "$BASE")
          if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          python3 tools/ci_solo_doc.py "$BASE"   # documents only: nothing to build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.solo.outputs.solo != 'true'
        with:
          python-version: "3.11"
      - name: Toolchain (version pinned in rust-toolchain.toml) and wasm32 target
        if: steps.solo.outputs.solo != 'true'
        run: |
          python tools/ci_toolchain.py
          rustup target add wasm32-unknown-unknown
      # warm start: the newest cache of a pytest shard (target/ with the crates of main already compiled); the path list must equal the shard's, it is part of the cache version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.solo.outputs.solo != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: prebuilt-${{ matrix.parte }}-${{ github.run_id }}
          restore-keys: |
            pytest-wasm-v3-rest-a-${{ runner.os }}-
      - name: Reuse the compiled crates of the cache
        if: steps.solo.outputs.solo != 'true'
        env:
          MZLAB_CACHE_JOB: pytest-shard   # the tree record is tied to the job that saved it; this job only restores
        run: python3 tools/ci_cargo_mtime.py restore
      # tools/ci_cargo/cargo: one target folder per feature family, the files hard-linked to target/ where tools/ci_prebuilt.py reads them
      - name: Build
        if: steps.solo.outputs.solo != 'true'
        run: |
          export PATH="$PWD/tools/ci_cargo:$PATH"
          python3 tools/ci_prebuilt.py build "${{ matrix.parte }}" "$RUNNER_TEMP/prebuilt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.solo.outputs.solo != 'true'
        with:
          name: prebuilt-${{ matrix.parte }}
          path: ${{ runner.temp }}/prebuilt
          retention-days: 1

  # Three parallel shards on 3.11: `rest-a` and `rest-b` (the two halves of `rest`) run every test except tools/pytest_solo_311.txt, `solo311` runs exactly those (slow tests where Python only
  # drives the Rust binaries and .wasm). Together they cover the whole suite once. Python 3.14 runs the whole suite in notte.yml; the `pytest` job below is the gate that keeps
  # both required names (3.14 included) and depends on the 3.11 shards.
  pytest-shard:
    name: pytest-shard (${{ matrix.python }}, ${{ matrix.parte }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", parte: rest-a}
          - {python: "3.11", parte: rest-b}
          - {python: "3.11", parte: solo311}
    permissions:
      contents: read
      actions: read   # tools/ci_cache_fresca.py lists the caches of main
    runs-on: ubuntu-latest
    # safety net only: the run lasts far less since the crates of the cache are reused (tools/ci_cargo_mtime.py)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # tools/ci_base.py: a pull request diffs its merge commit with its first parent
      # pull request only: is every changed file a document? (a push to main gets no base, so nothing is written)
      - id: solo
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(python3 tools/ci_base.py "$BASE")
          if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          python3 tools/ci_solo_doc.py "$BASE"   # documents only: appends solo=true and kind=doc
      # test files that rust.yml (rust-wasm) runs on the same diff are left out here (tools/ci_pytest_doppi.py); a push to main uses the previous head as base
      - id: doppi
        if: steps.solo.outputs.solo != 'true' && matrix.python == '3.11'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          BASE=$(python3 tools/ci_base.py "$BASE")
          if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || BASE=; fi
          python3 tools/ci_pytest_doppi.py "$BASE"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # a run that installs nothing (documents only) leaves no pip folder, and the post step of setup-python fails on a cache miss without it
      - name: Pip cache folder
        run: mkdir -p ~/.cache/pip
      # the tests that build a .wasm (test_untarget*, three of test_fair) are skipped without the wasm32 target and wasm-bindgen
      - name: Toolchain (version pinned in rust-toolchain.toml) and wasm32 target
        if: steps.solo.outputs.solo != 'true'
        run: |
          python tools/ci_toolchain.py
          rustup target add wasm32-unknown-unknown
      # Only the 3.11 shards save a cache, one per shard (`solo311` runs the release builds of the slow tests, which 3.14 skips). The unprefixed key is the one saved before the shards existed.
      # Every run restores the newest cache; only main saves one (a pull request too, but only while the newest cache has no tree record, tools/ci_cargo_mtime.py), keyed by the Rust sources (crates/, vendor/), so a pull request finds the crates of main
      # already compiled and rebuilds only what it changed. A cache saved on a pull request is seen by no other pull request.
      - id: rcache
        if: steps.solo.outputs.solo != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pytest-wasm-v3-${{ matrix.parte }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}-${{ hashFiles('tools/ci_cargo_mtime.py', 'tools/ci_cargo/cargo') }}-rel
          # v2 caches (saved with the incremental data, 3.3 GB) are only a warm start: the first run on v3 saves a cache without it
          restore-keys: |
            pytest-wasm-v3-${{ matrix.parte }}-${{ runner.os }}-
            pytest-wasm-v2-${{ matrix.parte }}-${{ runner.os }}-
            pytest-wasm-v2-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones
      - id: mtime
        name: Reuse the compiled crates of the cache
        if: steps.solo.outputs.solo != 'true'
        run: python3 tools/ci_cargo_mtime.py restore
      - name: wasm-bindgen-cli (same version as Cargo.lock)
        if: steps.solo.outputs.solo != 'true'
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$ver"; then
            cargo install wasm-bindgen-cli --version "$ver" --locked --force
          fi
      - name: Install
        if: steps.solo.outputs.solo != 'true' || matrix.parte != 'solo311'
        run: python -m pip install -e ".[test]" pytest-xdist
      # the files of the `prebuilt` jobs (tests/cargo_util.py installs them instead of running cargo); if those jobs failed, the tests build for themselves
      - id: prebuilt
        if: steps.solo.outputs.solo != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_attendi_job.py "prebuilt (native)" "prebuilt (wasm-a)" "prebuilt (wasm-b)"
      - if: steps.prebuilt.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: ${{ runner.temp }}/prebuilt
      - if: steps.prebuilt.outcome == 'success'
        run: |
          echo "MZLAB_PREBUILT=$RUNNER_TEMP/prebuilt" >> "$GITHUB_ENV"
          echo "MZLAB_PREBUILT_MISSES=$RUNNER_TEMP/prebuilt-misses.txt" >> "$GITHUB_ENV"
      # the tests spread over the 4 CPUs of the runner; --dist loadfile keeps the tests of one file in one worker (their fixtures build the .wasm once);
      # the slowest files go first (tools/ci_pytest_ordine.py). The `rest` shard skips tools/pytest_solo_311.txt: tests where Python only drives the Rust
      # binaries and .wasm and compares their output, identical on every Python; the 3.11 `solo311` shard runs only them, minus the files that rust-wasm runs on the same diff.
      - name: Unit tests
        if: steps.solo.outputs.solo != 'true'
        env:
          PYTHONPATH: tools
          PARTE: ${{ matrix.parte }}
        run: |
          # `cargo run` holds the build-directory lock until the program ends: tools/ci_cargo/cargo builds, releases the lock and then runs the binary
          export PATH="$PWD/tools/ci_cargo:$PATH"
          skip=(); alvo=(tests)
          ign=" ${{ steps.doppi.outputs.ignore }} "
          if [ "${{ matrix.parte }}" = solo311 ]; then
            # --ignore does not drop a file named on the command line, so the files rust-wasm already runs are left out of the list here
            alvo=()
            while read -r t; do case "$ign" in *" --ignore=${t%%::*} "*) ;; *) alvo+=("$t") ;; esac; done < tools/pytest_solo_311.txt
            if [ ${#alvo[@]} -eq 0 ]; then echo "every solo311 test is run by rust-wasm"; exit 0; fi
          else
            while read -r t; do skip+=(--deselect "$t"); done < tools/pytest_solo_311.txt
          fi
          # the `rest` shard runs in two halves (rest-a, rest-b: tools/ci_pytest_meta.py); solo311 runs whole
          if [ "$PARTE" != solo311 ]; then export CI_PYTEST_MITA="${PARTE#rest-}"; fi
          python -m pytest -q -n auto --dist loadfile -p ci_pytest_ordine -p ci_pytest_meta -p ci_pytest_tempi --durations=50 --junitxml="junit-${{ matrix.python }}-${{ matrix.parte }}.xml" "${skip[@]}" ${{ steps.doppi.outputs.ignore }} "${alvo[@]}"
      - name: Builds the tests ran themselves
        if: ${{ !cancelled() && steps.prebuilt.outcome == 'success' }}
        run: python3 tools/ci_prebuilt.py misses "$RUNNER_TEMP/prebuilt-misses.txt"
      # incremental data was 3.7 of the 11.5 GB of `target` (a 3.2 GB cache that takes 40-90 s to restore and pushes the other caches out of the 10 GB limit); a crate that changed is compiled in full instead
      - name: Drop the incremental data before the cache is saved
        if: ${{ !cancelled() && steps.solo.outputs.solo != 'true' && matrix.python == '3.11' }}
        run: find target -maxdepth 4 -type d -name incremental -prune -exec rm -rf {} +
      # time per test file for tools/ci_metrics.py (small, kept 3 days)
      - name: Test durations
        if: ${{ !cancelled() && hashFiles(format('junit-{0}-{1}.xml', matrix.python, matrix.parte)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.python }}-${{ matrix.parte }}
          path: |
            junit-${{ matrix.python }}-${{ matrix.parte }}.xml
            tempi-test.json
          if-no-files-found: ignore
          retention-days: 3
      # documents-only pull request: the document tests (the list is in tools/ci_solo_doc.py)
      - name: Unit tests (documents only)
        if: steps.solo.outputs.solo == 'true' && matrix.parte != 'solo311'
        run: python -m pytest -q -n auto --dist loadfile $(python tools/ci_solo_doc.py --pytest)
      # main saves at most once every 6 h per shard (tools/ci_cache_fresca.py); a pull request still seeds a cache with no tree record
      - id: fresca
        name: Skip the save while the cache of main is fresh
        if: ${{ !cancelled() && steps.solo.outputs.solo != 'true' && matrix.python == '3.11' && github.ref == 'refs/heads/main' && steps.rcache.outputs.cache-hit != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_cache_fresca.py "pytest-wasm-v3-${{ matrix.parte }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-"
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.solo.outputs.solo != 'true' && matrix.python == '3.11' && steps.rcache.outputs.cache-hit != 'true' && ((github.ref == 'refs/heads/main' && steps.fresca.outputs.fresh != 'true') || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.solo.outputs.solo != 'true' && matrix.python == '3.11' && steps.rcache.outputs.cache-hit != 'true' && ((github.ref == 'refs/heads/main' && steps.fresca.outputs.fresh != 'true') || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  # Gate with the names of the required checks of the "main protetto" ruleset: green only when every shard is green (a skipped or cancelled shard is not).
  pytest:
    name: pytest (ubuntu-latest, ${{ matrix.python }})
    needs: pytest-shard
    if: ${{ always() }}
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ESITO: ${{ needs.pytest-shard.result }}
        run: |
          echo "pytest-shard: $ESITO"
          [ "$ESITO" = success ]

  # The e2e smoke tests (tools/verifica.py --fumo: SMOKE) against the local Python server.
  # No Pyodide here: the engine of the site is tried by hand (see docs/agenti/).
  browser:
    name: browser (ubuntu-latest, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # tools/ci_base.py: a pull request diffs its merge commit with its first parent
      # pull request only: is every changed file a document? (a push to main gets no base, so nothing is written)
      - id: solo
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(python3 tools/ci_base.py "$BASE")
          if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          python3 tools/ci_solo_doc.py "$BASE"   # documents only: appends solo=true and kind=doc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # a run that installs nothing (documents only) leaves no pip folder, and the post step of setup-python fails on a cache miss without it
      - name: Pip cache folder
        run: mkdir -p ~/.cache/pip
      # the browser cache is saved on main only: a pull request's copy serves no other pull request and evicted the caches of main
      - id: pwcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-chromium-
      - name: Toolchain for the site of the e2e tests (rust-toolchain.toml, tools/prepara_sito.py)
        if: steps.solo.outputs.solo != 'true'
        run: python tools/ci_toolchain.py
      - id: rcache
        if: steps.solo.outputs.solo != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            target
          key: sito-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          restore-keys: sito-e2e-${{ runner.os }}-
      - name: Install
        if: steps.solo.outputs.kind != 'doc'
        run: |
          python -m pip install -e ".[test]" playwright axe-playwright-python
          python -m playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.solo.outputs.kind != 'doc' && github.ref == 'refs/heads/main' && steps.pwcache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pwcache.outputs.cache-primary-key }}
      - name: Smoke tests
        if: steps.solo.outputs.solo != 'true'
        run: python tools/verifica.py --browser chromium --fumo
      # size of every built .wasm against its cap, for tools/ci_metrics.py (small, kept 3 days)
      - name: Size of the .wasm
        if: ${{ !cancelled() && steps.solo.outputs.solo != 'true' }}
        run: python3 tools/ci_wasm_dimensioni.py site wasm-dimensioni.json
      - name: Size of the .wasm (artifact)
        if: ${{ !cancelled() && steps.solo.outputs.solo != 'true' && hashFiles('wasm-dimensioni.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-dimensioni
          path: wasm-dimensioni.json
          retention-days: 3
      # saved after the smoke tests have built the site and its .wasm (main only; a red test does not lose it)
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.rcache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}
      - name: Print the logs of the failed tests (readable in the job log)
        if: failure()
        shell: bash
        run: |
          [ -f .verifica/ultimo.md ] || { echo "No .verifica/ultimo.md: verifica.py stopped before writing its report (see the log of the failed step above)"; exit 0; }
          cat .verifica/ultimo.md | cut -c1-600
          # only the logs of the tests that failed (the others are in the artifact)
          for n in $(grep -o '^- FAIL [A-Za-z0-9_]*' .verifica/ultimo.md | awk '{print $3}'); do echo "===== $n"; tail -n 60 ".verifica/log/$n.log"; done
      - name: Logs of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifica-ubuntu-chromium
          path: .verifica/
          include-hidden-files: true
          if-no-files-found: ignore

  # Pull requests only, NOT a required check: the e2e of the changed files (tools/ci_e2e_cambiati.py, the map of tools/verifica.py) minus the smoke round of `browser`
  # and the tests of sito-e2e and the night. A core file selects every e2e: this job then runs none and says so, notte.yml runs them all. Caches are restored, never saved.
  e2e-cambiati:
    name: e2e changed files (chromium)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # tools/ci_base.py: a pull request diffs its merge commit with its first parent
      - id: scelta
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(python3 tools/ci_base.py "$BASE")
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 tools/ci_e2e_cambiati.py "$BASE"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scelta.outputs.e2e != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.scelta.outputs.e2e != ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-chromium-
      - name: Toolchain for the site of the e2e tests (rust-toolchain.toml, tools/prepara_sito.py)
        if: steps.scelta.outputs.e2e != ''
        run: python tools/ci_toolchain.py
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.scelta.outputs.e2e != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: sito-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          restore-keys: sito-e2e-${{ runner.os }}-
      - name: Install
        if: steps.scelta.outputs.e2e != ''
        run: |
          python -m pip install -e ".[test]" playwright axe-playwright-python
          python -m playwright install --with-deps chromium
      - name: e2e of the changed files
        if: steps.scelta.outputs.e2e != ''
        env:
          E2E: ${{ steps.scelta.outputs.e2e }}
        run: python tools/verifica.py --browser chromium --timeout 150 --solo "$E2E"
      - name: Print the logs of the failed tests (readable in the job log)
        if: failure()
        shell: bash
        run: |
          [ -f .verifica/ultimo.md ] || { echo "No .verifica/ultimo.md: verifica.py stopped before writing its report (see the log of the failed step above)"; exit 0; }
          cat .verifica/ultimo.md | cut -c1-600
          for n in $(grep -o '^- FAIL [A-Za-z0-9_]*' .verifica/ultimo.md | awk '{print $3}'); do echo "===== $n"; tail -n 60 ".verifica/log/$n.log"; done

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          # every script of the page; module-style files are checked as .mjs (new files are picked up by themselves)
          for f in mzlab/web/*.js; do
            b=$(basename "$f" .js)
            case "$b" in
              archivio|qqq-db|draw|sw|rust-worker|rust-bridge|mappa3d|workflow|perf|qualita|peaks-worker) cp "$f" "/tmp/$b.mjs"; node --check "/tmp/$b.mjs" ;;
              *) node --check "$f" ;;
            esac
          done
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("mzlab/web/index.html").read_text(encoding="utf-8")
          inline = re.findall(r"<script>(.*?)</script>", html, re.S)
          pathlib.Path("/tmp/inline.js").write_text("\n".join(inline), encoding="utf-8")
          PY
          # classic scripts share globals: check explore.js + inline together (no duplicate const)
          cat mzlab/web/explore.js mzlab/web/pannelli.js mzlab/web/grafici.js mzlab/web/picchi.js mzlab/web/eventi.js /tmp/inline.js > /tmp/page.js && node --check /tmp/page.js
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Map of the code and size limits
        run: |
          python3 tools/indice.py --controlla
          python3 tools/controlla.py

  # Types without a build step: tsc on the projects of tools/tipi/ (pagina, moduli, worker); the errors per file may only go down (tools/tipi/base_errori.json).
  tipi:
    name: tipi (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Globals
        run: python3 tools/tipi/genera_globali.py --controlla
      - name: tsc
        run: python3 tools/tipi/controlla_tsc.py
