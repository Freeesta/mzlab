# Publishes the whole program as a static site: Python + numpy run inside the student's browser (Pyodide).
# Nothing is uploaded anywhere: the mzML files stay in the browser of whoever opens the page.
# One-time setting on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site (downloads Pyodide from jsDelivr)
        run: python tools/build_site.py
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the WASM engine (only in the published site, never committed)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$ver"; then
            cargo install wasm-bindgen-cli --version "$ver" --locked --force
          fi
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm target/wasm32-unknown-unknown/release/mzlab_wasm.wasm
      - name: Build the libraries WASM engine (a .wasm of its own, fetched only when the libraries are opened; never committed)
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-lib-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm-lib target/wasm32-unknown-unknown/release/mzlab_lib_wasm.wasm
          bg=site/static/wasm-lib/mzlab_lib_wasm_bg.wasm
          if npm install --prefix "$RUNNER_TEMP/wo" wasm-opt@1.4.0; then
            "$RUNNER_TEMP/wo/node_modules/.bin/wasm-opt" -Oz --enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int -o "$bg" "$bg"
            size=$(stat -c %s "$bg"); echo "libraries .wasm (optimised): $size bytes"
            if [ "$size" -ge 614400 ]; then echo "::error::the libraries .wasm is $size bytes (limit 600 KB)"; exit 1; fi
          else
            echo "::warning::wasm-opt could not be installed: the libraries .wasm is not optimised ($(stat -c %s "$bg") bytes)"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
