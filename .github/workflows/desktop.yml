# Desktop app (crates/mzlab-desktop, Tauri v2): builds the installers on macOS (universal), Windows and Linux (AppImage, deb) and keeps them as artifacts of the run.
# The installers are never committed and never published in the site. Unsigned: no Apple/Microsoft account is used here.
# Runs by hand (workflow_dispatch) and when crates/mzlab-desktop/** changes. Not a required check of the protected main branch.
name: desktop

on:
  workflow_dispatch:
  workflow_call:                      # release.yml builds the installers of a tag by calling this workflow
  push:
    branches: [main]
    paths: ["crates/mzlab-desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["crates/mzlab-desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shim:
    name: page + shim + native engine (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: desktop-shim-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: python -m pip install numpy
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Site
        run: python tools/build_site.py --no-pyodide
      - name: Libraries WASM engine in the page (the .mzlib files of the folder are read by it; built like in pages.yml, never committed)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$ver"; then
            cargo install wasm-bindgen-cli --version "$ver" --locked --force
          fi
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-lib-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm-lib target/wasm32-unknown-unknown/release/mzlab_lib_wasm.wasm
      - name: Desktop folder
        run: python crates/mzlab-desktop/prepare.py
      - name: Page, shim and worker against the native engine (fake file dialog)
        run: python crates/mzlab-desktop/tests/e2e_shim.py
      - name: mzFinder in the page of the desktop (native routes, no Pyodide, no wasm-feat/)
        run: python crates/mzlab-desktop/tests/e2e_shim_finder.py

  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: "target/universal-apple-darwin/release/bundle/dmg/*.dmg"
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            artifact: "target/release/bundle/nsis/*.exe"
          - name: Linux
            os: ubuntu-22.04                  # the oldest glibc of the runners: the AppImage runs on older systems too
            args: --bundles appimage,deb
            artifact: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - name: Libraries of the window (WebKitGTK, Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Targets of the universal binary
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/bin/wasm-bindgen
            target
          key: desktop-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: cargo test (the mzlab:// protocol against the golden data)
        env:
          MZLAB_GOLDEN_STRICT: "1"
        run: cargo test --locked -p mzlab-desktop
      - name: "The page of the program (no Python, the app has none)"
        run: python tools/build_site.py --no-pyodide
      - name: Libraries WASM engine in the page (the .mzlib files of the folder are read by it; built like in pages.yml, never committed)
        shell: bash
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$ver"; then
            cargo install wasm-bindgen-cli --version "$ver" --locked --force
          fi
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-lib-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm-lib target/wasm32-unknown-unknown/release/mzlab_lib_wasm.wasm
      - name: Desktop folder
        run: python crates/mzlab-desktop/prepare.py
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked --force
      - name: Installer
        working-directory: crates/mzlab-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"     # Linux: linuxdeploy is an AppImage and the runners have no FUSE
          NO_STRIP: "true"                  # Linux: the strip of the runner does not know every section of the libraries
        run: cargo tauri build --features app ${{ matrix.args }} --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: mzlab-desktop-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
