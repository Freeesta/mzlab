# Diagnosis of the Rust engine that does not start on WebKit of the macOS runner (nightly `browser (macos-latest, webkit)`): by hand only
# (Actions > webkit-mac > Run workflow). `probe` = WebAssembly.Memory shapes in page and workers; the `site` variants build the site with the
# link flags of the variant (RUSTFLAGS here, NOT committed: .cargo/config.toml is untouched) and look whether the engine starts.
# Output: the PROBE / SITE lines of tests_e2e/webkit_sonda.py in the log, the crash reports and the system log of WebContent as artifact.
name: webkit-mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps webkit
          sysctl hw.memsize hw.ncpu; vm_stat | head -5
      - name: Probe page (memories, workers, grow, OPFS) in the ephemeral context of new_page()
        run: python tests_e2e/webkit_sonda.py probe 2>&1 | tee probe.txt
      - name: Same probe in a persistent context (profile directory on disk)
        env:
          WK_PERSISTENT: "1"
        run: python tests_e2e/webkit_sonda.py probe 2>&1 | tee -a probe.txt
      - name: Summary
        if: always()
        run: grep -h 'PROBE context\|NO \|first failing' probe.txt
      - name: System log and crash reports
        if: always()
        run: |
          mkdir -p diag
          cp probe.txt diag/ || true
          cp ~/Library/Logs/DiagnosticReports/* diag/ 2>/dev/null || true
          log show --last 10m --predicate 'process CONTAINS "WebContent" OR process CONTAINS "Playwright" OR eventMessage CONTAINS "memory"' --style compact 2>/dev/null | tail -n 400 > diag/system-log.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: webkit-probe
          path: diag/
          if-no-files-found: ignore

  site:
    name: site (${{ matrix.variant }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # base = the committed flags (.cargo/config.toml); the others replace them through RUSTFLAGS for this job only
          - { variant: base, rustflags: "", cores: "" }
          - { variant: max-memory-2g, rustflags: "-C link-arg=--initial-memory=33554432 -C link-arg=--max-memory=2147483648 -C target-feature=+simd128", cores: "" }
          - { variant: initial-memory-16m, rustflags: "-C link-arg=--initial-memory=16777216 -C link-arg=--max-memory=4294967296 -C target-feature=+simd128", cores: "" }
          - { variant: pool-1-worker, rustflags: "", cores: "2" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Toolchain (rust-toolchain.toml)
        run: python tools/ci_toolchain.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: webkit-mac-${{ matrix.variant }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: webkit-mac-${{ matrix.variant }}-
      - run: |
          python -m pip install -e ".[test]" playwright
          python -m playwright install --with-deps webkit
          sysctl hw.memsize hw.ncpu
      - name: Build the site (variant flags)
        # target-specific variable: it replaces the wasm32 rustflags of .cargo/config.toml and leaves the host builds (cargo install wasm-bindgen-cli) alone
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          [ -n "$CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS" ] || unset CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS
          python tools/prepara_sito.py
      - name: Engine start on WebKit
        env:
          WK_CORES: ${{ matrix.cores }}
        run: python tests_e2e/webkit_sonda.py site 2>&1 | tee site.txt
      - name: Engine start on WebKit in a persistent context
        if: always()
        env:
          WK_CORES: ${{ matrix.cores }}
          WK_PERSISTENT: "1"
        run: python tests_e2e/webkit_sonda.py site 2>&1 | tee site-persistent.txt
      - name: One smoke test (the real one, as the nightly runs it)
        if: always()
        run: python tools/verifica.py --browser webkit --fumo --solo e2e3 2>&1 | tee smoke.txt
      - name: System log and crash reports
        if: always()
        run: |
          mkdir -p diag
          cp site.txt site-persistent.txt smoke.txt diag/ || true
          cp .verifica/log/*.log diag/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/* diag/ 2>/dev/null || true
          log show --last 30m --predicate 'process CONTAINS "WebContent" OR process CONTAINS "Playwright" OR eventMessage CONTAINS "memory"' --style compact 2>/dev/null | tail -n 400 > diag/system-log.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: webkit-site-${{ matrix.variant }}
          path: diag/
          if-no-files-found: ignore
      - name: Summary (variant, engine starts, first failure)
        if: always()
        run: |
          echo "=== SUMMARY ${{ matrix.variant }}"
          grep -h '^SITE' site.txt site-persistent.txt 2>/dev/null || echo "SITE: no output (build failed?)"
          grep -h 'FAIL\|engine start failed\|unknown transient' smoke.txt 2>/dev/null | cut -c1-400 || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | head
