# Advisories of RustSec for the dependencies (cargo-deny, deny.toml). The list changes every day, so this check is NOT part of the pull
# requests (`rust-ok` in rust.yml covers licences and sources): it runs every day and by hand, and it is red when a new advisory appears.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
