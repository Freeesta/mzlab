# Advisories of RustSec for the dependencies (cargo-deny, deny.toml). The list changes every day, so this check is NOT part of the pull
# requests (`rust-ok` in rust.yml covers licences and sources): it runs every day and by hand, and it is red when a new advisory appears.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
