# Rust engine (crates/): tests, WASM build and a check of the dependencies in the WASM graph.
# The only check of the protected main branch for the Rust engine is the always-on job `rust-ok`. fmt, clippy and deny block this workflow (clippy and fmt against tools/clippy_base.json, which can only shrink).
# Cache: every run restores the newest one; runs on main save a new one when the Rust sources changed (key on crates/, vendor/, Cargo.lock), a pull request only while the newest cache has no tree record (tools/ci_cargo_mtime.py): a cache saved on a pull request is not visible to the other pull requests and would only push the ones of main out of the 10 GB of the repository.
name: rust

on:
  push:
    branches: [main]
  pull_request:
  # merge queue: rust-ok is a required check and must report on the queue branch too
  merge_group:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # main: every commit keeps its own result

jobs:
  # Decides from the changed paths whether the Rust jobs run (the workflow itself has no path filter, so `rust-ok` always reports).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      core: ${{ steps.diff.outputs.core }}
      deny: ${{ steps.diff.outputs.deny }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || echo "$BASE" | grep -qE '^0+$' || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "core=true" >> "$GITHUB_OUTPUT"; echo "deny=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(crates/|vendor/|Cargo\.|rust-toolchain\.toml|\.cargo/|\.github/workflows/rust\.yml|deny\.toml|tools/controlla_rust\.py|tools/ci_binari_test\.py|tools/ci_cargo_mtime\.py|tools/clippy_base\.json|tools/feat_mirato\.py|tests/test_feat_wasm\.py|tests/feat_wasm_node\.js|tests/test_guardie_memoria\.py)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          # rust-core covers crates with no other project dependency: it runs only when one of them, the toolchain, the lockfile or the golden data changed
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(crates/mzlab-(core|lettori|lib|libro|mol|target)/|Cargo\.|rust-toolchain\.toml|vendor/|\.cargo/|tests/golden/|tools/ci_binari_test\.py|tools/ci_cargo_mtime\.py|\.github/workflows/rust\.yml)'; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi
          # deny checks licences and sources of the dependencies: it runs only when manifests, lockfile, deny.toml, vendor/ or this workflow changed
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^vendor/|^\.github/workflows/rust\.yml$'; then
            echo "deny=true" >> "$GITHUB_OUTPUT"
          else
            echo "deny=false" >> "$GITHUB_OUTPUT"
          fi

  # The Rust jobs run in parallel (own caches, own target/): lint (fmt, clippy), wasm (builds, guards), det (determinism, native vs WASI), and the native tests in groups of crates (rust: mzlab-feat, rust-core: engine, readers, libraries, rust-misc-a: Attributio, chem, tutor, llm, rust-misc-b: all the others).
  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/cargo-machete
            target
          key: rust-v3-${{ runner.os }}-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-lint-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: fmt and clippy against the base (tools/controlla_rust.py, tools/clippy_base.json)
        run: python3 tools/controlla_rust.py
      # a dependency that no source of the crate names is dropped from its Cargo.toml (cargo-machete)
      - name: Unused dependencies (cargo machete)
        run: |
          command -v cargo-machete >/dev/null || cargo install cargo-machete --locked --version 0.9.2
          cargo machete
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/cargo-machete
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  # builds and the dependency check; the guards (which build their own .wasm) run in rust-wasm-guardie at the same time
  rust-wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-wasm-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: WASM build (release)
        run: cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-wasm
      - name: The libraries crates and mzlab-feat build for WASM
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-lib -p mzlab-lib-wasm -p mzlab-feat -p mzlab-feat-grafo-wasm
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-wasm --no-default-features --features detect
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-wasm --no-default-features --features proofs
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-wasm --no-default-features --features mrm
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-table-wasm
      - name: No native dependencies in the WASM graph
        run: |
          for p in mzlab-wasm mzlab-lib mzlab-lib-wasm mzlab-feat mzlab-feat-wasm mzlab-feat-table-wasm mzlab-feat-grafo-wasm; do
            tree=$(cargo tree --locked -e no-dev --target wasm32-unknown-unknown -p $p)
            if echo "$tree" | grep -E '(^|[^A-Za-z0-9_-])(memmap2|zstd-sys|libz-sys|cc) v'; then
              echo "::error::forbidden dependency in the WASM graph of $p"; exit 1
            fi
          done
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  rust-wasm-guardie:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-wasmguard-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-wasmguard-
            rust-v3-${{ runner.os }}-wasm-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: numpy (the guards write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      # installed before the cache is saved: ~/.cargo/bin/wasm-bindgen is in the cached paths, and installing it after the save recompiled it on every run (~90 s)
      - name: wasm-bindgen CLI (the version of Cargo.lock)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          wasm-bindgen --version 2>/dev/null | grep -q "$ver" || cargo install wasm-bindgen-cli --version "$ver" --locked --force
      - name: Guards of memory and same bytes under a reduced budget (docs/agenti/memoria.md)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_guardie_memoria.py tests/test_feat_wasm.py
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  # Own job: the determinism proof (native vs WASI) used to run last in rust-wasm and made it the slowest job.
  rust-det:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-det-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-det-
            rust-v3-${{ runner.os }}-wasm-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: numpy (the workflow writes the synthetic files with tools/golden.py)
        run: python -m pip install numpy pytest
      # the same synthetic workflow native and as WASI under node gives the same SHA-256 (docs/agenti/rust-flow.md)
      - name: Workflow determinism, native and WASI
        run: |
          rustup target add wasm32-wasip1
          python -m pip install jsonschema
          python -m pytest -q tests/test_flow_determinismo.py
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}


  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-testfeat-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-testfeat-
            rust-v3-${{ runner.os }}-test-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: numpy (the parity tests write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      # The native test binaries are optimised (opt-level 3) but without the LTO and the single codegen unit of the .wasm profile:
      # these two settings only make the .wasm small, and on ~150 test binaries they cost ~10 minutes of linking.
      - name: Tests of mzlab-feat (parity with tests/golden/)
        env:
          MZLAB_GOLDEN_STRICT: "1"
          MZLAB_IDX_STRICT: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: |
          cargo test --locked --release -p mzlab-feat
          # the graph view of a mol/1 record is not a default feature either
          cargo test --locked --release -p mzlab-feat --features record --test grafo_record --test posizioni_record --test frammenti_record
          cargo test --locked --release -p mzlab-feat --features record,interp --test interp_record
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  rust-core:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-testcore-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-testcore-
            rust-v3-${{ runner.os }}-test-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: numpy (the parity tests write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      # The native test binaries are optimised (opt-level 3) but without the LTO and the single codegen unit of the .wasm profile:
      # these two settings only make the .wasm small, and on ~150 test binaries they cost ~10 minutes of linking.
      - name: Tests of mzlab-core, the readers and the libraries (parity with tests/golden/)
        env:
          MZLAB_GOLDEN_STRICT: "1"
          MZLAB_IDX_STRICT: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: |
          # one build, then the test binaries four at a time (tools/ci_binari_test.py), one log group per binary
          python3 tools/ci_binari_test.py -j 4 -- --locked --release -p mzlab-core -p mzlab-lettori -p mzlab-lib -p mzlab-libro -p mzlab-mol -p mzlab-target
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  rust-misc-a:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-testmisca-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-testmisca-
            rust-v3-${{ runner.os }}-test-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: numpy (the parity tests write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      # The native test binaries are optimised (opt-level 3) but without the LTO and the single codegen unit of the .wasm profile:
      # these two settings only make the .wasm small, and on ~150 test binaries they cost ~10 minutes of linking.
      - name: Tests of Attributio, chem, tutor and llm (parity with tests/golden/)
        env:
          MZLAB_GOLDEN_STRICT: "1"
          MZLAB_IDX_STRICT: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: |
          # each build once, then its test binaries four at a time (tools/ci_binari_test.py), one log group per binary
          python3 tools/ci_binari_test.py -j 4 -- --locked --release -p mzlab-attributio-wasm -p mzlab-chem -p mzlab-chem-wasm -p mzlab-tutor -p mzlab-llm -p mzlab-llm-wasm
          # the fused .wasm of Attributio (feature all) is not a default feature: its own tests run here
          python3 tools/ci_binari_test.py -j 4 -- --locked --release -p mzlab-attributio-wasm --features all
          python3 tools/ci_binari_test.py -j 4 -- --locked --release -p mzlab-chem --features record --test mol3d_record
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  rust-misc-b:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-v3-${{ runner.os }}-testmiscb-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-v3-${{ runner.os }}-testmiscb-
            rust-v3-${{ runner.os }}-test-
            rust-v3-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: numpy (the parity tests write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      # The native test binaries are optimised (opt-level 3) but without the LTO and the single codegen unit of the .wasm profile:
      # these two settings only make the .wasm small, and on ~150 test binaries they cost ~10 minutes of linking.
      - name: Tests of the other crates (parity with tests/golden/)
        env:
          MZLAB_GOLDEN_STRICT: "1"
          MZLAB_IDX_STRICT: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: |
          # every other crate of the workspace (a new crate lands here unless it is added to a list above or to rust-misc-a)
          python3 tools/ci_binari_test.py -j 4 -- --locked --release --workspace --exclude mzlab-feat --exclude mzlab-core --exclude mzlab-lettori --exclude mzlab-lib --exclude mzlab-libro --exclude mzlab-mol --exclude mzlab-target --exclude mzlab-attributio-wasm --exclude mzlab-chem --exclude mzlab-chem-wasm --exclude mzlab-tutor --exclude mzlab-llm --exclude mzlab-llm-wasm
      # saved last and also after a red step (main only)
      - name: Record the tree of the cache
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        run: python3 tools/ci_cargo_mtime.py record
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && steps.rcache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.mtime.outputs.record != 'true') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  # Licences and sources of the dependencies (deny.toml). The advisories (RustSec) change every day: they are checked by .github/workflows/advisories.yml, not here.
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources

  # The one name for the protection of main: green when every Rust job passed; a skipped job is accepted only when `changes` found no Rust path (rust-core also when none of its crates changed, deny also when no manifest changed). A failed or cancelled job is red.
  rust-ok:
    if: always()
    needs: [changes, rust, rust-core, rust-misc-a, rust-misc-b, rust-wasm, rust-wasm-guardie, rust-det, rust-lint, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Every Rust job passed, or all were skipped because no Rust path changed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST_DIFF: ${{ needs.changes.outputs.rust }}
          CORE_DIFF: ${{ needs.changes.outputs.core }}
          CORE: ${{ needs.rust-core.result }}
          DENY_DIFF: ${{ needs.changes.outputs.deny }}
          DENY: ${{ needs.deny.result }}
          JOBS: ${{ needs.rust.result }} ${{ needs.rust-misc-a.result }} ${{ needs.rust-misc-b.result }} ${{ needs.rust-wasm.result }} ${{ needs.rust-wasm-guardie.result }} ${{ needs.rust-det.result }} ${{ needs.rust-lint.result }}
        run: |
          echo "changes: $CHANGES (rust=$RUST_DIFF core=$CORE_DIFF); rust-core: $CORE; rust rust-misc-a rust-misc-b rust-wasm rust-wasm-guardie rust-det rust-lint: $JOBS; deny: $DENY (deny=$DENY_DIFF)"
          [ "$CHANGES" = "success" ] || exit 1
          case "$JOBS $CORE $DENY" in *failure*|*cancelled*) exit 1;; esac
          # with a Rust diff nothing may be skipped, except rust-core when none of its paths changed
          if [ "$RUST_DIFF" = "true" ]; then
            case "$JOBS" in *skipped*) exit 1;; esac
            if [ "$CORE_DIFF" = "true" ]; then [ "$CORE" = "success" ] || exit 1; else [ "$CORE" = "skipped" ] || exit 1; fi
            if [ "$DENY_DIFF" = "true" ]; then [ "$DENY" = "success" ] || exit 1; else [ "$DENY" = "skipped" ] || exit 1; fi
          fi
