# Rust engine (crates/): tests, WASM build and a check of the dependencies in the WASM graph.
# The only check of the protected main branch for the Rust engine is the always-on job `rust-ok`. fmt, clippy and deny block this workflow (clippy and fmt against tools/clippy_base.json, which can only shrink).
# Cache: every run restores the newest one; only runs on main save a new one, and only when the Rust sources changed (key on crates/, vendor/, Cargo.lock): a cache saved on a pull request is not visible to the other pull requests and would only push the ones of main out of the 10 GB of the repository.
name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # main: every commit keeps its own result

jobs:
  # Decides from the changed paths whether the Rust jobs run (the workflow itself has no path filter, so `rust-ok` always reports).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || echo "$BASE" | grep -qE '^0+$' || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(crates/|vendor/|Cargo\.|rust-toolchain\.toml|\.cargo/|\.github/workflows/rust\.yml|deny\.toml|tools/controlla_rust\.py|tools/clippy_base\.json)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # The three Rust jobs run in parallel (own caches, own target/): lint (fmt, clippy), wasm (builds, guards), rust (native tests, the slowest).
  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/cargo-machete
            target
          key: rust-${{ runner.os }}-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-${{ runner.os }}-lint-
            rust-${{ runner.os }}-
      - name: fmt and clippy against the base (tools/controlla_rust.py, tools/clippy_base.json)
        run: python3 tools/controlla_rust.py
      # a dependency that no source of the crate names is dropped from its Cargo.toml (cargo-machete)
      - name: Unused dependencies (cargo machete)
        run: |
          command -v cargo-machete >/dev/null || cargo install cargo-machete --locked --version 0.9.2
          cargo machete
      # saved last and also after a red step (main only)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && github.ref == 'refs/heads/main' && steps.rcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/cargo-machete
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  rust-wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-${{ runner.os }}-wasm-
            rust-${{ runner.os }}-
      - name: numpy (the guards write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      - name: WASM build (release)
        run: cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-wasm
      - name: The libraries crates and mzlab-feat build for WASM
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-lib -p mzlab-lib-wasm -p mzlab-feat -p mzlab-feat-grafo-wasm
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-wasm --no-default-features --features detect
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-wasm --no-default-features --features proofs
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-wasm --no-default-features --features mrm
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-feat-table-wasm
      # installed before the cache is saved: ~/.cargo/bin/wasm-bindgen is in the cached paths, and installing it after the save recompiled it on every run (~90 s)
      - name: wasm-bindgen CLI (the version of Cargo.lock)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          wasm-bindgen --version 2>/dev/null | grep -q "$ver" || cargo install wasm-bindgen-cli --version "$ver" --locked --force
      - name: No native dependencies in the WASM graph
        run: |
          for p in mzlab-wasm mzlab-lib mzlab-lib-wasm mzlab-feat mzlab-feat-wasm mzlab-feat-table-wasm mzlab-feat-grafo-wasm; do
            tree=$(cargo tree --locked -e no-dev --target wasm32-unknown-unknown -p $p)
            if echo "$tree" | grep -E '(^|[^A-Za-z0-9_-])(memmap2|zstd-sys|libz-sys|cc) v'; then
              echo "::error::forbidden dependency in the WASM graph of $p"; exit 1
            fi
          done
      - name: Guards of memory and same bytes under a reduced budget (docs/agenti/memoria.md)
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_guardie_memoria.py tests/test_feat_wasm.py
      # the same synthetic workflow native and as WASI under node gives the same SHA-256 (docs/agenti/rust-flow.md)
      - name: Workflow determinism, native and WASI
        run: |
          rustup target add wasm32-wasip1
          python -m pip install jsonschema
          python -m pytest -q tests/test_flow_determinismo.py
      # saved last and also after a red step (main only)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && github.ref == 'refs/heads/main' && steps.rcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - id: rcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: rust-${{ runner.os }}-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}
          # the kind-specific caches first, then any older cache (the one of the single job) so the first run is not cold
          restore-keys: |
            rust-${{ runner.os }}-test-
            rust-${{ runner.os }}-
      - name: numpy (the parity tests write the synthetic files with tools/golden.py)
        run: python -m pip install numpy
      # The native test binaries are optimised (opt-level 3) but without the LTO and the single codegen unit of the .wasm profile:
      # these two settings only make the .wasm small, and on ~150 test binaries they cost ~10 minutes of linking.
      - name: Tests (parity with tests/golden/)
        env:
          MZLAB_GOLDEN_STRICT: "1"
          MZLAB_IDX_STRICT: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: |
          cargo test --locked --release
          # the fused .wasm of Attributio (feature all) is not a default feature: its own tests run here
          cargo test --locked --release -p mzlab-attributio-wasm --features all
      # saved last and also after a red step (main only)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && github.ref == 'refs/heads/main' && steps.rcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}

  # Licences and sources of the dependencies (deny.toml). The advisories (RustSec) change every day: they are checked by .github/workflows/advisories.yml, not here.
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources

  # The one name for the protection of main: green when rust, rust-wasm, rust-lint and deny passed, or were skipped because no Rust path changed.
  rust-ok:
    if: always()
    needs: [changes, rust, rust-wasm, rust-lint, deny]
    runs-on: ubuntu-latest
    steps:
      - name: rust, rust-wasm, rust-lint and deny passed or were skipped
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.rust.result }} ${{ needs.rust-wasm.result }} ${{ needs.rust-lint.result }} ${{ needs.deny.result }}
        run: |
          echo "changes rust rust-wasm rust-lint deny: $RESULTS"
          case "$RESULTS" in *failure*|*cancelled*) exit 1;; esac
          [ "${{ needs.changes.result }}" = "success" ]
