# TEMPORARY (removed in the next commit): the publish job of app-main.yml, run against the artifacts of run 45901726514 to see the real 403.
name: app-probe-tmp
on:
  push:
    branches: [claude/app-rolling]
    paths: [.github/workflows/app-probe-tmp.yml]
permissions:
  contents: read
jobs:
  publish:
    name: pre-release app-prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: app-prebuilt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mzlab-desktop-*
          path: parts
          run-id: 45901726514
          github-token: ${{ github.token }}
      - name: Give the files their fixed names (tools/note_app_main.py is the one list) and write SHA256SUMS
        run: |
          mkdir out
          python3 tools/note_app_main.py --names | while IFS='|' read -r art glob name; do
            # a single upload path is flat, two paths (Linux) keep their folders: search the whole artifact
            f=$(find parts/"$art" -type f -name "$glob" | sort | head -n 1)
            [ -n "$f" ] || { echo "::error::no $glob in the artifact $art"; exit 1; }
            cp "$f" "out/$name"
          done
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Notes (commit, dates, how to open an unsigned app)
        run: |
          python3 tools/note_app_main.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --commit-date "$(git show -s --format=%cs "$GITHUB_SHA")" --built "$(date -u +%Y-%m-%dT%H:%MZ)" > NOTES.md
          cat NOTES.md
      - name: Create the pre-release once; keep it a pre-release, never "latest", with the title and the notes of this commit
        run: |
          title="mzLab app built from main (NOT a release)"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes-file NOTES.md
      - name: Upload the new files (the old ones of the same name are replaced), then remove any other asset, then write the notes
        run: |
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          keep=$(ls out)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r n; do
            echo "$keep" | grep -qxF "$n" || { echo "delete $n"; gh release delete-asset "$TAG" "$n" --yes --repo "$GITHUB_REPOSITORY"; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "mzLab app built from main (NOT a release)" --notes-file NOTES.md
