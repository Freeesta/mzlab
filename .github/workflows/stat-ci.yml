# Statistics of the CI bottlenecks (tools/ci_metrics.py, docs/agenti/ci-fast.md): one JSONL line per event on the orphan branch `stat-ci`.
# No secret and no third-party action; GITHUB_TOKEN only reads the API and pushes to `stat-ci` (a push with GITHUB_TOKEN starts no workflow).
# No pull_request_target (GitHub blocks it by default in public repositories from 2 December 2026) and no event carrying pull request code:
# pull request events are read from the API by the poll, so code of a pull request is never run with the write token.
name: stat-ci

# The runs of test/rust/pages are read by a poll (schedule, plus every push to main; cursor in cursore.json on stat-ci), not one job per completed run.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# One poll at a time; the events of pull requests and pushes have a group each, so none is dropped.
concurrency:
  group: stat-ci-${{ github.event_name == 'schedule' && 'poll' || github.run_id }}
  cancel-in-progress: false

# No scope by default: each job asks only for what it uses.
permissions: {}

jobs:
  registra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push the rows to the `stat-ci` branch; also /commits/{sha} and the checkout
      actions: read          # /actions/runs, jobs, logs and artifacts of the polled runs
      checks: read           # /commits/{sha}/check-runs (green-to-merge time)
      pull-requests: read    # /pulls, /pulls/{n}/files, /pulls/{n}/reviews
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Data branch
        run: |
          git config user.name "stat-ci"
          git config user.email "stat-ci@users.noreply.github.com"
          if git fetch --depth=1 origin stat-ci; then
            git worktree add -B stat-ci dati FETCH_HEAD
          else
            git worktree add --orphan -b stat-ci dati
          fi
      - name: Record the event
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch) cmd=registra-recenti ;;
            push) cmd=registra-conflitti
              # history without file contents: enough for the read-only trial merge (git merge-tree) of the conflicting pull requests
              git fetch -q --filter=blob:none --unshallow origin main || true ;;
            *) exit 0 ;;
          esac
          python3 tools/ci_metrics.py "$cmd" --data-file dati/eventi.jsonl --new nuovi.jsonl --cursor cursore-nuovo.json
          # best-effort backfill of the green-to-merge time of old rows, 30 per poll (a lost publish race just repeats it)
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch|push) python3 tools/ci_metrics.py riempi-verde --data-file dati/eventi.jsonl || true ;; esac
          # GitHub fires the cron only a few times a day: every push to main also polls the completed runs (rows are deduplicated, the cursor only advances)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 tools/ci_metrics.py registra-recenti --data-file dati/eventi.jsonl --new nuovi-recenti.jsonl --cursor cursore-nuovo.json
            cat nuovi-recenti.jsonl >> nuovi.jsonl
            python3 tools/ci_metrics.py registra-coda --new nuovi-coda.jsonl
            cat nuovi-coda.jsonl >> nuovi.jsonl
          fi
          # pull request events (opened, pushed heads, merged/closed) are read from the API, metadata only; rows are deduplicated
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch|push)
            python3 tools/ci_metrics.py registra-pr-recenti --data-file dati/eventi.jsonl --new nuovi-pr.jsonl
            cat nuovi-pr.jsonl >> nuovi.jsonl ;;
          esac
      # metrics are best effort: a failed publish must never turn a pull request red
      - name: Publish on stat-ci
        continue-on-error: true
        working-directory: dati
        run: |
          for i in 1 2 3 4 5; do
            python3 ../tools/ci_metrics.py accoda ../nuovi.jsonl --data-file eventi.jsonl --cursor ../cursore-nuovo.json
            # new rows go to eventi-YYYY-MM.jsonl; files of 50 MB or more are never rewritten (GitHub refuses 100 MB)
            [ "$(cat eventi*.jsonl | wc -c)" -gt 4000000 ] && python3 ../tools/ci_metrics.py compatta --data-file eventi.jsonl
            git add -A
            git diff --cached --quiet && exit 0
            git commit -qm "stat-ci: events"
            git push origin HEAD:stat-ci && exit 0
            git fetch --depth=1 origin stat-ci && git reset -q --hard FETCH_HEAD
          done
          echo "::warning::stat-ci: events not published"
          exit 0
      # One denied poll is a warning and a row; three within an hour (rows already published above) turn this run red, so a persistent failure is seen.
      - name: Persistent API denial
        working-directory: dati
        run: python3 ../tools/ci_metrics.py denials --data-file eventi.jsonl

  # Every commit rewrites a JSONL part, so the history of `stat-ci` grows without bound while the tip stays small.
  # Nothing reads the history (readers use the tip), so once it passes a threshold the branch is replaced by one commit with the same tree.
  # --force-with-lease makes a concurrent publish win: the squash then fails harmlessly and is retried by the next poll.
  poda:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: registra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # force-push the squashed `stat-ci` branch; git only, no API read, so nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Squash the history of stat-ci
        continue-on-error: true
        run: |
          git config user.name "stat-ci"
          git config user.email "stat-ci@users.noreply.github.com"
          git fetch -q --filter=blob:none --no-tags origin stat-ci || exit 0
          tip=$(git rev-parse FETCH_HEAD)
          n=$(git rev-list --count "$tip")
          echo "stat-ci history: $n commits"
          [ "$n" -gt 200 ] || exit 0
          new=$(git commit-tree "$tip^{tree}" -m "stat-ci: history squashed (was $n commits)")
          git push --force-with-lease="refs/heads/stat-ci:$tip" origin "$new:refs/heads/stat-ci"
