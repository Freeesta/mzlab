# Release: a tag `vX.Y.Z` builds the site as a zip, the installers (macOS, Windows, Linux), the SBOM and SHA256SUMS, and prepares a DRAFT
# release with the notes of CHANGELOG.md. Nothing is published by itself: the owner reads the draft and presses "Publish release"
# (that is also what makes Zenodo archive it). Steps for the owner: docs/agenti/rilascio.md.
# Without a terminal: Actions > release > Run workflow on main, with the version typed twice. The draft is made from the head of main; the tag is
# created when the owner publishes it. With the version left empty it is a dry run: everything is built and kept as artifacts, no release is made.
# When a published draft creates its tag, this workflow starts again on that tag and sees the release exists: it does nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versione:
        description: "Version to release, X.Y.Z (leave empty for a dry run: everything is built, nothing is published)"
        required: false
        default: ""
      conferma:
        description: "Type the same version again to confirm"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controllo:
    name: what to do
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.c.outputs.tag }}
      crea: ${{ steps.c.outputs.crea }}
      salta: ${{ steps.c.outputs.salta }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ inputs.versione }}
          CONFERMA: ${{ inputs.conferma }}
        run: |
          set -euo pipefail
          tag=dev; crea=false; salta=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then salta=true; else crea=true; fi
          elif [ -n "$VERSIONE" ]; then
            [[ "$VERSIONE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version must be X.Y.Z"; exit 1; }
            [ "$CONFERMA" = "$VERSIONE" ] || { echo "::error::the confirmation must be the same version, typed again"; exit 1; }
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run it on the main branch"; exit 1; }
            tag="v$VERSIONE"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::the release $tag already exists"; exit 1; fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then echo "::error::the tag $tag already exists"; exit 1; fi
            crea=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "crea=$crea" >> "$GITHUB_OUTPUT"; echo "salta=$salta" >> "$GITHUB_OUTPUT"
  versione:
    name: one version everywhere
    needs: controllo
    if: needs.controllo.outputs.salta != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.controllo.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cargo.toml, tauri.conf.json and CITATION.cff say the same version
        run: python tools/versione.py
      - name: ... and it is the one of the tag, with notes in CHANGELOG.md
        if: needs.controllo.outputs.crea == 'true'
        run: |
          python tools/versione.py --tag "$TAG"
          python tools/versione.py --nota "$TAG" > NOTE.md
      - uses: actions/upload-artifact@v4
        if: needs.controllo.outputs.crea == 'true'
        with:
          name: note
          path: NOTE.md

  sito:
    name: site (zip) + SBOM of the JavaScript components
    needs: [controllo, versione]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.controllo.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site (downloads Pyodide from jsDelivr)
        run: python tools/build_site.py
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the WASM engine (only in the published site, never committed)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$ver"; then
            cargo install wasm-bindgen-cli --version "$ver" --locked --force
          fi
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm target/wasm32-unknown-unknown/release/mzlab_wasm.wasm
          tools/wasm_opt.sh site/static/wasm/mzlab_wasm_bg.wasm 1572864 engine
      - name: Build the libraries WASM engine (a .wasm of its own, fetched only when the libraries are opened; never committed)
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-lib-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm-lib target/wasm32-unknown-unknown/release/mzlab_lib_wasm.wasm
          tools/wasm_opt.sh site/static/wasm-lib/mzlab_lib_wasm_bg.wasm 614400 libraries
      - name: Build the mzFinder WASM engines (two .wasm of their own, under 400 KB each, with their SHA-256; never committed)
        run: tools/build_feat_wasm.sh site/static
      - name: Restore the spectral-library packages from the cache (pinned MassBank release, built with the Rust builder, never committed)
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: site/static/librerie
          key: librerie-${{ hashFiles('tools/librerie_pacchetti.py', 'crates/mzlab-lib/src/**', 'tests/golden/librerie/massbank_unito/**') }}
      - name: Build the packages and the catalog (a network failure only warns, the site is published without packages)
        if: steps.libcache.outputs.cache-hit != 'true'
        run: python tools/librerie_pacchetti.py --out site/static/librerie
      - name: Save the packages in the cache
        if: steps.libcache.outputs.cache-hit != 'true' && hashFiles('site/static/librerie/catalogo.json') != ''
        uses: actions/cache/save@v4
        with:
          path: site/static/librerie
          key: librerie-${{ hashFiles('tools/librerie_pacchetti.py', 'crates/mzlab-lib/src/**', 'tests/golden/librerie/massbank_unito/**') }}
      - name: Build the suspect index of mzFinder (pinned CC BY sources, never committed; a network failure only warns)
        run: python tools/genera_sospetti.py --pacchetto site/static/mzfinder/sospetti
      # The same steps as pages.yml (build job): a release ships exactly the site that would be published.
      - name: Zip of the site
        run: |
          cd site && zip -qr "../mzlab-site-${TAG}.zip" . && cd ..
          python tools/sbom.py --out sbom-js.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sito
          path: |
            mzlab-site-*.zip
            sbom-js.cdx.json
          if-no-files-found: error

  desktop:
    name: installers
    needs: [controllo, versione]
    uses: ./.github/workflows/desktop.yml

  sbom:
    name: SBOM of the Rust crates
    needs: [controllo, versione]
    uses: ./.github/workflows/sbom.yml

  bozza:
    name: draft release
    needs: [controllo, versione, sito, desktop, sbom]
    if: needs.controllo.outputs.crea == 'true'
    runs-on: ubuntu-latest
    environment: release          # the owner can require an approval here (Settings > Environments); secrets for signing live only there
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pezzi
      - name: Gather the files and compute SHA256SUMS
        run: |
          mkdir dist
          find pezzi -type f ! -name NOTE.md -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release with the notes of CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.controllo.outputs.tag }}
        run: |
          target=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); fi      # from the dispatch: the tag is created when the draft is published
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft "${target[@]}" \
            --title "mzLab ${TAG}" --notes-file pezzi/note/NOTE.md
