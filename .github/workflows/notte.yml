# Level 3 of the tests (AGENTS.md §3): the whole round, once a day on main (and by hand: Actions > notte > Run workflow).
# Unit tests on Mac and Windows, the e2e smoke tests on Firefox, WebKit (the engine of Safari, on macOS) and Chromium on Windows,
# and the complete verification (all the e2e) on Chromium Linux. Red in the morning = a correction job for the Coordinatore.
name: notte

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, every night
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    # measured on the runners: macOS 3.11 took 10.5 min serially; with the xdist workers (as in test.yml) and the cargo builds of the wasm tests 25 min is the ceiling
    timeout-minutes: 25
    # Windows: the tests compare bytes and sizes of the checked-out files (LF) and read text files with the default encoding (UTF-8 here, as on Linux and macOS)
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out with LF endings
        # text=auto in .gitattributes checks out CRLF on Windows (core.eol=native); the tests pin LF bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]" pytest-xdist
      # one install of the toolchain of rust-toolchain.toml before the workers start: several workers asking rustup for it at once corrupt the install
      - name: Rust toolchain
        run: rustup show
      # --dist loadfile keeps the tests of one file in one worker (their fixtures build the .wasm once)
      - name: Unit tests
        run: python -m pytest -q -n auto --dist loadfile tests

  browser:
    name: browser (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: firefox }
          - { os: macos-latest, browser: webkit }
          - { os: windows-latest, browser: chromium }
    runs-on: ${{ matrix.os }}
    # WebKit on the macOS runner informs only: the Rust engine does not start there ("unknown transient reason, e.g. out of memory",
    # 11 of 12 smoke tests), a fault of the runner or of WebKit to be looked at on a Mac; the other browsers still fail the night
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-${{ matrix.browser }}-
      - name: Toolchain for the site of the e2e tests (rust-toolchain.toml, tools/prepara_sito.py)
        run: rustup show
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            target
          key: sito-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: sito-e2e-${{ runner.os }}-
      - name: Install
        run: |
          python -m pip install -e ".[test]" playwright axe-playwright-python pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      # The layout tests are measured with Inter (the font system-ui resolves to on the development machines); the runner would fall back to the wider DejaVu Sans
      - name: Fonts of the layout tests (Inter as system-ui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-inter
          sudo cp tools/fontconfig/56-prefer-inter.conf /etc/fonts/conf.d/
          sudo fc-cache -f
          fc-match system-ui
      - name: Smoke tests
        run: python tools/verifica.py --browser ${{ matrix.browser }} --fumo
      - name: Print the logs of the failed tests (readable in the job log)
        if: failure()
        shell: bash
        run: |
          [ -f .verifica/ultimo.md ] || { echo "No .verifica/ultimo.md: verifica.py stopped before writing its report (see the log of the failed step above)"; exit 0; }
          cat .verifica/ultimo.md | cut -c1-600
          for n in $(grep -o '^- FAIL [A-Za-z0-9_]*' .verifica/ultimo.md | awk '{print $3}'); do echo "===== $n"; tail -n 60 ".verifica/log/$n.log"; done
      - name: Logs of the failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notte-${{ matrix.os }}-${{ matrix.browser }}
          path: .verifica/
          include-hidden-files: true
          if-no-files-found: ignore

  # the complete verification: JS syntax, pytest, prova_hr and every e2e (synthetic data: the tests that need the real data are skipped)
  # in three parallel parts (tools/verifica.py --parte K/3: part 1 also does syntax, texts, pytest and prova_hr), each with its own report .verifica/ultimo.md
  completa:
    name: completa (${{ matrix.parte }}/3)
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-chromium-
      - name: Toolchain for the site of the e2e tests (rust-toolchain.toml, tools/prepara_sito.py)
        run: rustup show
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
            target
          key: sito-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: sito-e2e-${{ runner.os }}-
      - name: Install
        run: |
          python -m pip install -e ".[test]" playwright axe-playwright-python pillow
          python -m playwright install --with-deps chromium
      # The layout tests are measured with Inter (the font system-ui resolves to on the development machines); the runner would fall back to the wider DejaVu Sans
      - name: Fonts of the layout tests (Inter as system-ui)
        run: |
          sudo apt-get install -y fonts-inter
          sudo cp tools/fontconfig/56-prefer-inter.conf /etc/fonts/conf.d/
          sudo fc-cache -f
          fc-match system-ui
      # the step has its own ceiling, so the report steps below still run if a part hangs
      - name: Complete verification (part ${{ matrix.parte }}/3)
        timeout-minutes: 50
        run: python tools/verifica.py --browser chromium --parte ${{ matrix.parte }}/3
      # the second round of the engine: the built site with the Rust engine (?motore=rust) against Python on the same files
      # verifica.py rewrites .verifica/ultimo.md, so the report of the part is kept apart first
      - name: Rust engine on the built site
        if: matrix.parte == 3 && !cancelled()
        run: |
          cp .verifica/ultimo.md .verifica/ultimo-parte.md || true
          python tools/build_site.py
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$ver"; then cargo install wasm-bindgen-cli --version "$ver" --locked --force; fi
          cargo build --locked --release --target wasm32-unknown-unknown -p mzlab-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm target/wasm32-unknown-unknown/release/mzlab_wasm.wasm
          python tools/verifica.py --browser chromium --solo e2e_rust
      # times and memory of the two engines (skipped without the real data: bench.py needs Full Scan files)
      - name: Measures
        if: matrix.parte == 3
        continue-on-error: true
        run: python tools/bench.py --memoria
      - name: Print the logs of the failed tests (readable in the job log)
        if: always()
        shell: bash
        run: |
          [ -f .verifica/ultimo.md ] || { echo "No .verifica/ultimo.md: verifica.py stopped before writing its report (see the log of the failed step above)"; exit 0; }
          [ ! -f .verifica/ultimo-parte.md ] || { echo "--- part report"; cut -c1-2000 .verifica/ultimo-parte.md; echo "--- e2e_rust report"; }
          cat .verifica/ultimo.md | cut -c1-2000
          grep -c '^- FAIL' .verifica/ultimo.md || true
          for n in $(grep -o '^- FAIL [A-Za-z0-9_]*' .verifica/ultimo.md | awk '{print $3}'); do echo "===== $n"; tail -n 60 ".verifica/log/$n.log"; done
      - name: Report and logs of the part
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notte-completa-${{ matrix.parte }}
          path: .verifica/
          include-hidden-files: true
          if-no-files-found: ignore
