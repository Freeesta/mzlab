name: notte
on:
  workflow_dispatch:
    inputs:
      solo:
        required: false
        default: ""
jobs:
  dbg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: probe
        shell: python
        run: |
          import sys, subprocess, tempfile, pathlib
          sys.path.insert(0, "tests")
          import test_wasm_opt_chiuso as t
          tmp = pathlib.Path(tempfile.mkdtemp())
          fake = t._bin(tmp)
          print("fake curl bytes:", (fake / "curl").read_bytes()[:60])
          bash = t._git_bash(); git = bash.parent.parent
          import os
          env = {"PATH": os.pathsep.join([str(fake), str(git / "usr" / "bin"), str(git / "bin")]), "SYSTEMROOT": r"C:\Windows"}
          print(subprocess.run([str(bash), "-c", "command -v curl; command -v wasm-opt; command -v npm; command -v flock; curl -fsSL x; echo rc=$?"], env=env, capture_output=True, text=True))
          print(open(tmp/"curl.log").read() if (tmp/"curl.log").exists() else "no curl.log")
      - name: run the tests
        run: python -m pytest tests/test_wasm_opt_chiuso.py -vv -x -q
