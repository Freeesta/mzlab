# cargo-fuzz targets for the parsers of files; a workspace of its own (nightly + libFuzzer), never built by the main workspace or by the mandatory CI.
[package]
name = "mzlab-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# the entry points live in ingressi.rs and ingressi_lettori.rs, pulled in by #[path]; machete does not follow them
[package.metadata.cargo-machete]
ignored = ["mzlab-core", "mzlab-lib", "mzlab-lettori"]

[dependencies]
libfuzzer-sys = "0.4"
mzlab-core = { path = "../crates/mzlab-core" }
mzlab-lib = { path = "../crates/mzlab-lib" }
mzlab-lettori = { path = "../crates/mzlab-lettori", features = ["tutte"] }

[workspace]

[[bin]]
name = "ole"
path = "fuzz_targets/ole.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmltree_methodinfo"
path = "fuzz_targets/xmltree_methodinfo.rs"
test = false
doc = false
bench = false

