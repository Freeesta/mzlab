[package]
name = "mzlab-feat-slots-wasm"
description = "wasm-bindgen bridge of the feature-slots/1 of a row of the feature table; a .wasm of its own, loaded on the first row whose Slots tab is opened"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
# the same features as the table module, so a build of all in one cargo run unifies nothing new
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["interp"] }
mzlab-ops = { path = "../mzlab-ops", features = ["table"] }
wasm-bindgen = "0.2"
