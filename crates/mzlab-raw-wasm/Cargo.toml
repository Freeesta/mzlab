[package]
name = "mzlab-raw-wasm"
description = "wasm-bindgen bridge of api/rawinfo (mzlab_core::rawinfo: what a raw file holds, read from its .mzidx); a .wasm of its own, loaded by the worker of the engine on the first request"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
# the engine's features, so a build of both in one cargo run unifies nothing new
mzlab-core = { path = "../mzlab-core", default-features = false, features = ["mappa-dad", "isotopi-tutti"] }
wasm-bindgen = "0.2"
