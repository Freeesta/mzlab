[package]
name = "mzlab-lib-wasm"
description = "wasm-bindgen bridge of mzlab-lib (spectral libraries); runs ONLY inside the Web Worker of the libraries, as a .wasm of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
mzlab-lib = { path = "../mzlab-lib" }
serde_json = "1"
wasm-bindgen = "0.2"
