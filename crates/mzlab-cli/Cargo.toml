[package]
name = "mzlab-cli"
description = "mzLab on the command line: `mzlab-cli features` runs the feature engine of the app on files and writes the feature table as CSV (native only, never in the WASM graph)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mzlab-cli"
path = "src/main.rs"

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-lettori = { path = "../mzlab-lettori", features = ["tutte"] }
# the same features as mzlab-desktop: one build of each crate in the workspace
mzlab-feat = { path = "../mzlab-feat", features = ["chem", "untargeted", "attributio"] }
mzlab-feat-wasm = { path = "../mzlab-feat-wasm", default-features = false, features = ["detect", "proofs", "finder", "untargeted"] }
mzlab-feat-table-wasm = { path = "../mzlab-feat-table-wasm" }

