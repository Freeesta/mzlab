[package]
name = "mzlab-cli"
description = "mzLab on the command line: `mzlab-cli features` runs the feature engine of the app on files and writes the feature table as CSV (native only, never in the WASM graph)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mzlab-cli"
path = "src/main.rs"

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-lib = { path = "../mzlab-lib" }
mzlab-chem = { path = "../mzlab-chem" }
mzlab-llm = { path = "../mzlab-llm" }
mzlab-tutor = { path = "../mzlab-tutor" }
mzlab-lettori = { path = "../mzlab-lettori", features = ["tutte"] }
# the same features as mzlab-desktop: one build of each crate in the workspace
mzlab-feat = { path = "../mzlab-feat", features = ["chem", "untargeted", "attributio", "interp", "record"] }
mzlab-feat-wasm = { path = "../mzlab-feat-wasm", default-features = false, features = ["detect", "proofs", "finder", "untargeted", "interp"] }
mzlab-feat-table-wasm = { path = "../mzlab-feat-table-wasm" }
mzlab-mol = { path = "../mzlab-mol" }


# the PNG of a figure of the MSn graph (`mzlab-cli msn-graph --figura png`): rasterises the SVG, pure Rust; not in the default build, never in a .wasm
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"], optional = true }

[features]
png = ["dep:resvg"]

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
