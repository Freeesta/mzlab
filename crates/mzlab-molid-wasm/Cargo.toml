[package]
name = "mzlab-molid-wasm"
description = "wasm-bindgen bridge of the catalogue identity of a drawing (molfile or SMILES -> molid/1, mzlab_feat::chem::identity); a .wasm of its own, loaded by the Draw page on the first «Is this in the catalogue?»"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["identita"] }
wasm-bindgen = "0.2"
