[package]
name = "mzlab-lettori-wasm"
description = "wasm-bindgen bridge of the readers of the vendor files (mzlab-core::lettori: .D, .wiff, .raw); a .wasm of its own, so the engine of the site does not carry the readers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
js-sys = "0.3.106"
wasm-bindgen = "0.2"
