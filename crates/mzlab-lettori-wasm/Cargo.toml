[package]
name = "mzlab-lettori-wasm"
description = "wasm-bindgen bridge of mzlab-lettori (the readers modules, one per family); runs ONLY inside the Web Worker of the readers, as a .wasm of its own per family"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# the families, forwarded to mzlab-lettori: tools/build_lettori_wasm.sh builds one .wasm per family with --no-default-features --features <family>
aperti = ["lettura", "mzlab-lettori/aperti"]
andi = ["lettura", "mzlab-lettori/andi"]
thermo = ["lettura", "mzlab-lettori/thermo"]
agilent = ["lettura", "mzlab-lettori/agilent"]
sciex = ["lettura", "mzlab-lettori/sciex"]
waters = ["lettura", "mzlab-lettori/waters"]
shimadzu = ["lettura", "mzlab-lettori/shimadzu"]
bruker = ["lettura", "mzlab-lettori/bruker"]
# the readers code of the families (probe, to_mzml, the sessions); the `valida` module has none of it
lettura = []
# the mzML validator alone: the module `valida` of the page (`mzlab-cli validate` in a .wasm)
valida = ["mzlab-core/valida"]
tutte = ["lettura", "mzlab-lettori/tutte"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core", default-features = false }
mzlab-lettori = { path = "../mzlab-lettori", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
# the proof of the external reader of the engine (`LettoreEsterno`) over the session of this module, on a real `.raw` (tests/esterno_thermo.rs)
mzlab-wasm = { path = "../mzlab-wasm", default-features = false }
