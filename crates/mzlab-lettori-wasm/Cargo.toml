[package]
name = "mzlab-lettori-wasm"
description = "wasm-bindgen bridge of mzlab-lettori (the readers module); runs ONLY inside its Web Worker, as a .wasm of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-lettori = { path = "../mzlab-lettori" }
serde_json = "1"
wasm-bindgen = "0.2"
