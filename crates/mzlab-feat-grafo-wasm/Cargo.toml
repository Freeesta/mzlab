[package]
name = "mzlab-feat-grafo-wasm"
description = "wasm-bindgen bridge of the structure graph of mzlab-feat (SMILES -> formula, groups, cleavages); a .wasm of its own, loaded by mzFinder only when the user gives a SMILES"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `isotopi-tutti`: the natural abundances of every element for the isotope pattern of `anal/1`, as the app and the CLI have them (same bytes)
mzlab-core = { path = "../mzlab-core", features = ["isotopi-tutti"] }
mzlab-feat = { path = "../mzlab-feat", features = ["sel"] }
wasm-bindgen = "0.2"
