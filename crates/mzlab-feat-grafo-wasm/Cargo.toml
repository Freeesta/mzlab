[package]
name = "mzlab-feat-grafo-wasm"
description = "wasm-bindgen bridge of the structure graph of mzlab-feat (SMILES -> formula, groups, cleavages); a .wasm of its own, loaded by mzFinder only when the user gives a SMILES"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat" }
wasm-bindgen = "0.2"
