[package]
name = "mzlab-chem"
description = "mzLab chemistry engine: 3D geometry from SMILES (ETKDG + MMFF94, conformers), numbered like mzlab_feat::chem::graph::Mol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", features = ["chem"] }
mzlab-mol = { path = "../mzlab-mol", optional = true }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
sci-form = { version = "=1.0.0", default-features = false }

[features]
# `Mol3d::from_record`: the 3D molecule from a `mol/1` record (`mzlab-mol`). Off by default and in every .wasm.
record = ["mzlab-feat/record", "dep:mzlab-mol"]

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "mol3d_record"
required-features = ["record"]
