[package]
name = "mzlab-attributio-wasm"
description = "wasm-bindgen bridge of the table of levels of Attributio (mzlab-feat, feature attributio); a .wasm of its own, loaded by mzFinder only in administrator mode when a campaign folder is chosen"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The Banco 2b (review of one feature and saving of the decision) as a .wasm of its own, `attributio-rev`; without it the .wasm is the table of levels
rev = []
# The four spreadsheet exports (Schymanski folder, publication table, quantification, gradient) with the cascade as a .wasm of its own, `attributio-export`; the evidence export is in `attributio-rev`
export = []

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["attributio"] }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
