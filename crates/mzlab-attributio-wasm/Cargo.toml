[package]
name = "mzlab-attributio-wasm"
description = "wasm-bindgen bridge of the table of levels of Attributio (mzlab-feat, feature attributio); a .wasm of its own, loaded by mzFinder only in administrator mode when a campaign folder is chosen"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The Banco 2b (review of one feature and saving of the decision); part of the fused `attributio-all` .wasm
rev = ["mzlab-feat/crippen"]
# The four spreadsheet exports (Schymanski folder, publication table, quantification, gradient) with the cascade; the evidence export belongs to `rev`
export = []
# The MS2 engine (library search, in-silico ranking, hydrogen rearrangements, RT forest, chimeric intruders); part of the fused .wasm
ms2 = []
# The four of the above in ONE .wasm (`attributio`, the cascade of the table, the review, the exports and the MS2 engine): the module the site loads
all = ["rev", "export", "ms2", "mzlab-feat/flow_formula"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["attributio"] }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
