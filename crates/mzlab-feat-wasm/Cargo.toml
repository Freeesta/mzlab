[package]
name = "mzlab-feat-wasm"
description = "wasm-bindgen bridge of mzlab-feat (feature detection, alignment, hypotheses, proofs); runs ONLY inside the Web Worker of mzFinder, as a .wasm of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Four .wasm come from this crate, each under 500 KB (the CI builds them with --no-default-features): `detect` = L1-L6 (detect_file, align_series), `proofs` = L7-L9
# (run_hypotheses, build_evidence), `mrm` = L1-L6 of the MRM files (detect_mrm_file, align_mrm_series; it carries the reader of the chromatograms of the mzML,
# loaded only for an MRM series), `finder` = what the Pyodide of mzFinder served (classify, formula_info, identity_graph, polarity_pairs, the Dig of a high-resolution series and its fragmentation tree; it turns on `mzlab-feat/chem` for the SMILES). All on (the default) is the native build used by the tests and the examples.
default = ["detect", "proofs", "mrm", "finder"]
detect = []
proofs = []
mrm = []
finder = ["mzlab-feat/chem"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
# the example `nativo` reads a SMILES like the page does (the .wasm of the proofs keeps `chem` off)
mzlab-feat = { path = "../mzlab-feat" }
sha2 = { version = "0.10", default-features = false }
