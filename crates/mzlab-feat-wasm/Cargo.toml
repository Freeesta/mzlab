[package]
name = "mzlab-feat-wasm"
description = "wasm-bindgen bridge of mzlab-feat (feature detection, alignment, hypotheses, proofs); runs ONLY inside the Web Worker of mzFinder, as a .wasm of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Two .wasm come from this crate, each under 400 KB (the CI builds them with --no-default-features): `detect` = L1-L6 (detect_file, align_series), `proofs` = L7-L9
# (run_hypotheses, build_evidence). Both on (the default) is the native build used by the tests and the examples.
default = ["detect", "proofs"]
detect = []
proofs = []

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
