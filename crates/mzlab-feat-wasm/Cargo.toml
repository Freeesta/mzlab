[package]
name = "mzlab-feat-wasm"
description = "wasm-bindgen bridge of mzlab-feat (feature detection, alignment, hypotheses, proofs); runs ONLY inside the Web Worker of mzFinder, as a .wasm of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Five .wasm come from this crate (the four of the list and `untargeted`), each under 500 KB (the CI builds them with --no-default-features): `detect` = L1-L6 (detect_file, align_series), `proofs` = L7-L9
# (run_hypotheses, build_evidence), `finder` = what the Pyodide of mzFinder served (classify, formula_info, identity_graph, polarity_pairs, the Dig of a high-resolution series and its fragmentation tree; it turns on `mzlab-feat/chem` for the SMILES), `finder_edge` = identity_graph, polarity_pairs and origin_evidence (a .wasm of its own, loaded when the page asks for one), `finder_msn` = the MSn tree of the standard, its library and the localisation of the products (loaded only when a file of the series is MSn). All on (the default) is the native build used by the tests and the examples.
default = ["detect", "proofs", "finder", "finder_msn", "finder_edge", "flow_ms2"]
# `flow_ms2` = the text of `spectra.ms2` for the browser (`run_ms2.rs`); in the `hr` .wasm, not in the separate builds.
flow_ms2 = []
# `flow_formula` = the text of `formula.ms1` (`run_formula.rs`): a .wasm of its own, `formula` (`tools/moduli/formula.toml`), loaded only by its executor; NOT among the defaults.
flow_formula = ["mzlab-feat/untargeted"]
# `flow_tab` = the Flow table steps that do not fit `table` (`run_tab.rs`: `table.drift`): a .wasm of its own, `flowtab`, loaded only by their executors; NOT among the defaults.
flow_tab = []
# `flow_stat` = `table.stats`, `table.pca`, `table.kmd` of the Flow (`run_stat.rs`): a .wasm of its own, `flowstat`, loaded only by their executor (`flow-web-stat.js`); NOT among the defaults.
flow_stat = []
# `flow_compare` = `table.compare` of the Flow (`run_compare.rs`): a .wasm of its own, `flowcompare`, loaded only by its executor (`flow-web-stat.js`); NOT among the defaults.
flow_compare = []
# `detect` carries `mzlab-feat/untargeted` for what `features.detect` and `features.align` reach of it: the isotope finder (`flow_isofinder`, `isofinder`), the algorithm
# `adap_localmin` (`flow`, `adap`, `resolve`, `arpls`, `smooth`, `pipeline_stream`) and the table algorithm `align_mzmine` (`flow_align`, `join`, `gapfill`); about 136 KB of `hr` before wasm-opt.
detect = ["mzlab-feat/untargeted", "mzlab-ops/detect"]
proofs = ["mzlab-ops/proofs"]
finder = ["mzlab-feat/chem", "mzlab-feat/legacy"]
finder_msn = ["mzlab-feat/chem", "mzlab-feat/legacy"]
finder_edge = ["mzlab-feat/chem", "mzlab-feat/legacy"]
# `interp` = the interpretation of the rows of a table (`interp/1`, `docs/agenti/interp.md`): a .wasm of its own, loaded only when a table has its block written; NOT among the defaults.
interp = ["mzlab-feat/interp", "mzlab-ops/table"]
# `untargeted` = the pipeline after mzmine 3.9.0 (detect_untargeted_to, align_untargeted_to; `docs/agenti/attributio.md`): a .wasm of its own, NOT among the defaults.
untargeted = ["mzlab-feat/untargeted", "mzlab-ops/untargeted"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false }
mzlab-ops = { path = "../mzlab-ops" }
wasm-bindgen = "0.2"

[[example]]
name = "untargeted"
required-features = ["untargeted"]

[dev-dependencies]
serde_json = "1"
# the example `native` reads a SMILES like the page does (the .wasm of the proofs keeps `chem` off)
mzlab-feat = { path = "../mzlab-feat" }
sha2 = { version = "0.11", default-features = false }
