[package]
name = "mzlab-target"
description = "mzLab target and suspect screening list reader, RFC 4180 CSV parser and validation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
# exp/ln/pow from libm on every target: the system library of a native build and the libm port of wasm32 differ in the last bit (docs/agenti/parita.md)
libm = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
