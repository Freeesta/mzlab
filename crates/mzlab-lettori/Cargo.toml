[package]
name = "mzlab-lettori"
description = "The readers of vendor files, one module per family of formats: served only by the .wasm modules of the readers (loaded on demand) and by the desktop app, never by the engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# one feature per family (docs/agenti/lettori-modulo.md); `tutte` is for the desktop app and for cargo test
aperti = ["mzlab-core/precursori"]
andi = []
thermo = ["mzlab-core/thermo", "mzlab-core/precursori"]
agilent = []
sciex = ["mzlab-core/sciex"]
waters = []
shimadzu = []
# the SQLite reader is written in the crate (bruker/sqlite_min.rs); ruzstd (MIT, pure Rust) decodes the blocks of analysis.tdf_bin
bruker = ["dep:ruzstd", "mzlab-core/precursori"]
tutte = ["aperti", "andi", "thermo", "agilent", "sciex", "waters", "shimadzu", "bruker"]

[dependencies]
# no default features: each family module carries only the readers of its own family (`thermo` turns on the Thermo reader of the core)
mzlab-core = { path = "../mzlab-core", default-features = false, features = ["estesi"] }

# the decoders of the peaks of an mzXML (base64 and zlib), versions as in mzlab-core
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# the zstd decoder of the Bruker blocks (already in the workspace for the .mzlib format); without the checksum feature: the blocks have none
ruzstd = { version = "0.9", optional = true, default-features = false, features = ["std"] }
[dev-dependencies]
# the tests check the keys of metodo/1 against its schema
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# the scandump example (tools of the Thermo oracle bench, docs/agenti/scandump.md) reads the file with the same functions as the `thermo` module; never part of a .wasm
opentfraw = { path = "../../vendor/opentfraw" }
sha2 = { version = "0.11", default-features = false }

[[example]]
name = "thermo_scandump"
required-features = ["thermo"]
