[package]
name = "mzlab-lettori"
description = "The readers of vendor files, one module per family of formats: served only by the .wasm modules of the readers (loaded on demand) and by the desktop app, never by the engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# one feature per family (docs/agenti/lettori-modulo.md); `tutte` is for the desktop app and for cargo test
aperti = []
thermo = []
agilent = []
sciex = []
waters = []
shimadzu = []
bruker = []
tutte = ["aperti", "thermo", "agilent", "sciex", "waters", "shimadzu", "bruker"]

[dependencies]
mzlab-core = { path = "../mzlab-core", features = ["estesi"] }

[dev-dependencies]
# the tests build their own mzML files (an encoder of numpress and of zlib arrays); versions as in mzlab-core
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
