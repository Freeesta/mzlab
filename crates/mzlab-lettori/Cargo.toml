[package]
name = "mzlab-lettori"
description = "The readers of vendor files, one module per family of formats: served only by the .wasm modules of the readers (loaded on demand) and by the desktop app, never by the engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# one feature per family (docs/agenti/lettori-modulo.md); `tutte` is for the desktop app and for cargo test
aperti = []
andi = []
thermo = ["mzlab-core/thermo"]
agilent = []
sciex = ["mzlab-core/sciex"]
waters = []
shimadzu = []
bruker = []
tutte = ["aperti", "andi", "thermo", "agilent", "sciex", "waters", "shimadzu", "bruker"]

[dependencies]
# no default features: each family module carries only the readers of its own family (`thermo` turns on the Thermo reader of the core)
mzlab-core = { path = "../mzlab-core", default-features = false, features = ["estesi"] }

# the decoders of the peaks of an mzXML (base64 and zlib), versions as in mzlab-core
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# the tests check the keys of metodo/1 against its schema
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
