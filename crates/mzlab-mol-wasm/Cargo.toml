[package]
name = "mzlab-mol-wasm"
description = "wasm-bindgen bridge of the molecule kit of Draw on the mol/1 record (check/1 of mzlab_feat::chem::check, substructure/1 and substructure_db/1 of mzlab_feat::chem::substructure); a .wasm of its own (molkit), loaded by the page only when the user asks for it"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `isotopi-tutti`: the natural abundances of every element for the `analysis/1` inside `descriptors/1`, as the app and the CLI have them (same bytes)
mzlab-core = { path = "../mzlab-core", features = ["isotopi-tutti"] }
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["check", "sub"] }
wasm-bindgen = "0.2"
