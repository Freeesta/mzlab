[package]
name = "mzlab-mol-wasm"
description = "wasm-bindgen bridge of the molecule kit of Draw on the mol/1 record (check/1 of mzlab_feat::chem::check); a .wasm of its own (molkit), loaded by the page only when the user asks for it"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["check"] }
wasm-bindgen = "0.2"
