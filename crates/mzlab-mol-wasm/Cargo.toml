[package]
name = "mzlab-mol-wasm"
description = "wasm-bindgen bridge of the drawing check of Draw (molfile -> check/1 of mzlab_feat::chem::check, on the mol/1 record); a .wasm of its own, loaded by the page only when the user asks for the check"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["check"] }
wasm-bindgen = "0.2"
