[package]
name = "mzlab-llm-wasm"
description = "wasm-bindgen bridge of mzlab-llm (requests, normalized streams, recordings); a .wasm of its own, loaded only after the user turned the assistant on"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-llm = { path = "../mzlab-llm" }
wasm-bindgen = "0.2"
