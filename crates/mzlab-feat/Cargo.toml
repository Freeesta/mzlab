[package]
name = "mzlab-feat"
description = "mzLab feature detection: ion traces of the MS1 peaks of a .mzidx, in slabs of m/z (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
libm = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }
mzlab-lib = { path = "../mzlab-lib" }
