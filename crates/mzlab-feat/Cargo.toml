[package]
name = "mzlab-feat"
description = "mzLab feature detection: ion traces of the MS1 peaks of a .mzidx, in slabs of m/z (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# `chem`: the structure graph (SMILES -> groups, cleavages). On by default; the engine of the proofs (`mzlab-feat-wasm`) turns it off so its .wasm does not carry it.
default = ["chem"]
chem = []
# `record`: the structure graph built from a `mol/1` record (`graph::Mol::from_record`, crate `mzlab-mol`) and the substructure search. Off by default and in every .wasm.
record = ["chem", "dep:mzlab-mol", "sub"]
# `sub`: the substructure search `chem::substructure` (`sub/1`, `subdb/1` over a structure list). Off by default; the molkit `.wasm` (`mzlab-mol-wasm`) carries it.
sub = ["chem", "dep:mzlab-mol"]
# `check`: `check/1`, the structure check of a drawing (`chem::check`, molfile read by `mzlab-mol`), and `sdf/1`, the drawing as a molfile or SDF (`chem::sdf`). Off by default; the molkit `.wasm` (`mzlab-mol-wasm`), the CLI and the desktop app carry it.
check = ["chem", "dep:mzlab-mol"]
# `crippen`: `LogPValues::from_smiles`, the Crippen logP and descriptors of a SMILES from our own tables (`mzlab-mol`), for the RT-logP check of the Banco 2b. Off by default; the `.wasm` `attributio` carries it through its feature `rev`.
crippen = ["dep:mzlab-mol"]
# `attributio`: reading of the campaign folders of Attributio (campaign.toml, mzMine/SIRIUS/GNPS2 tables, decisions), its review matching on top of `mzlab-lib` and its level cascade and table (`docs/agenti/attributio.md`). Off by default; the `.wasm` `attributio` (`crates/mzlab-attributio-wasm`) and the desktop app carry it.
attributio = ["dep:mzlab-lib", "chem"]
# `flow_formula`: the text of `formula.ms2@1` (`flow_formula_ms2`), which reads the MGF with the reader of `mzlab-lib` (`flowmatch`). Off by default; the `.wasm` `attributio` (feature `all`) and the CLI carry it.
flow_formula = ["attributio", "mzlab-lib/flow"]
# `untargeted`: detection of the features from the raw data after the algorithms of mzmine 3.9.0 (`src/untargeted/`), rewritten from scratch. Off by default.
untargeted = []
# `interp`: the interpretation of each row of the feature table of the products (`interp/1`, `filtri/1`; `docs/agenti/interp.md`). Off by default; the `.wasm` `interp` carries it.
interp = ["chem"]
# `figura`: the static figure (SVG) and the stand-alone HTML of a fragmentation graph `msngrafo/1` (`msnfigura`; the molecule of the root read by `mzlab-mol`). Off by default; the CLI and the `.wasm` `msnfigura` carry it.
figura = ["dep:mzlab-mol"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
libm = "0.2"
mzlab-lib = { path = "../mzlab-lib", optional = true }
mzlab-mol = { path = "../mzlab-mol", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
mzlab-lib = { path = "../mzlab-lib" }
sha2 = { version = "0.11", default-features = false }

