[package]
name = "mzlab-feat"
description = "mzLab feature detection: ion traces of the MS1 peaks of a .mzidx, in slabs of m/z (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# `chem`: the structure graph (SMILES -> groups, cleavages). On by default; the engine of the proofs (`mzlab-feat-wasm`) turns it off so its .wasm does not carry it.
default = ["chem"]
chem = []
# `attributio`: reading of the campaign folders of Attributio (campaign.toml, mzMine/SIRIUS/GNPS2 tables, decisions) and, in the next packages, its level cascade. Off by default: no `.wasm` carries it yet.
attributio = []

[dependencies]
mzlab-core = { path = "../mzlab-core" }
libm = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
mzlab-lib = { path = "../mzlab-lib" }
