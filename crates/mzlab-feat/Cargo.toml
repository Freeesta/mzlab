[package]
name = "mzlab-feat"
description = "mzLab feature detection: ion traces of the MS1 peaks of a .mzidx, in slabs of m/z (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# `chem`: the structure graph (SMILES -> groups, cleavages). On by default; the engine of the proofs (`mzlab-feat-wasm`) turns it off so its .wasm does not carry it.
default = ["chem"]
chem = []
# `untargeted`: detection stages rewritten after mzmine 3.9.0 (`src/untargeted/`, docs/agenti/attributio.md). Off by default; no `.wasm` carries it yet.
untargeted = []

[dependencies]
mzlab-core = { path = "../mzlab-core" }
libm = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
mzlab-lib = { path = "../mzlab-lib" }

[[test]]
name = "untargeted_join"
required-features = ["untargeted"]

[[test]]
name = "untargeted_gapfill"
required-features = ["untargeted"]

[[test]]
name = "untargeted_join_dati"
required-features = ["untargeted"]
