[package]
name = "mzlab-finder-lr-wasm"
description = "wasm-bindgen bridge of the low-resolution Dig of mzFinder (mzlab_feat::legacy::lr); a .wasm of its own, loaded by the worker of mzFinder only for a low-resolution series"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
# the tests run the pipeline natively (detection, alignment, hypotheses) like the pool of feat-worker.js does
mzlab-feat-wasm = { path = "../mzlab-feat-wasm" }
serde_json = "1"
