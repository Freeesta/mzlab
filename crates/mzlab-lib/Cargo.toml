[package]
name = "mzlab-lib"
description = "mzLab spectral libraries: parsers (MSP, MGF, JSON, MassBank), the .mzlib format, Flash-style indexes and scores (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `flow`: the text of `spectra.match` / `table.match` (`flowmatch`), the one implementation of `flow run` and of the browser. Off by default: it needs `mzlab-core` (json, score terms).
flow = ["dep:mzlab-core"]

[dependencies]
ruzstd = "0.9"
serde_json = "1"
mzlab-core = { path = "../mzlab-core", default-features = false, optional = true }

[dev-dependencies]
mzlab-core = { path = "../mzlab-core" }
