[package]
name = "mzlab-sub-wasm"
description = "wasm-bindgen bridge of the substructure search of mzlab-mol (a drawn moiety in SMILES or molfiles -> sub/1); a .wasm of its own, loaded by the Draw page only when the user asks for the search"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-feat = { path = "../mzlab-feat", default-features = false, features = ["record"] }
wasm-bindgen = "0.2"
