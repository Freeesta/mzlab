[package]
name = "mzlab-core"
description = "mzLab core: mzML reading, TIC/XIC and peaks (pure Rust, no native dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the Thermo `.raw` reader (`raw`, `rawlettore`, `rawfilter`, `metodo_raw`, the `opentfraw` dependency): the engine (mzlab-wasm) leaves it off and reaches it through the `thermo` readers module
default = ["thermo", "mappa-dad", "precursori"]
thermo = ["dep:opentfraw"]
# the precursor chain, activation and energy of `<precursorList>` in the mzML writer (`mzmlwrite/spettro.rs`): the readers that fill `SpectrumExtra::precursors` turn it on; the engine and the other readers modules (under a size limit) leave it off
precursori = []
# variants of the readers served only by the readers module (crates/mzlab-lettori), never by the engine (mzlab-wasm leaves it off)
estesi = []
# the 2D map of the optical detector of a `.wiff` (`wiff/dad_map.rs`, `dad_map` of the `Lettore` trait): the engine and the desktop app serve it, the readers module (`sciex`, under a size limit) only converts and leaves it off
mappa-dad = []
# the mzML validator (`mzmlvalida`) in a `.wasm`: the `aperti` readers module turns it on (native builds always have it)
valida = []
# what only the SCIEX readers module needs beyond `estesi` and the other families must not carry (their .wasm is under a size limit): the `variante` method of the `Lettore` trait and the `cv:` parameters of the mzML writer
sciex = ["estesi"]
# the bench `raw_mzml_banco` with zlib-rs in place of miniz_oxide behind flate2 (a second build of the same bench, to compare the two on the same code)
banco-zlib-rs = ["flate2/zlib-rs"]

[dependencies]
quick-xml = "0.42"
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
opentfraw = { path = "../../vendor/opentfraw", optional = true }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }

[[example]]
name = "raw2mzml"
required-features = ["thermo"]

[[example]]
name = "raw_referenza"
required-features = ["thermo"]

[[example]]
name = "raw_mzml_banco"
path = "examples/raw_mzml_banco/main.rs"
required-features = ["thermo"]
test = true
