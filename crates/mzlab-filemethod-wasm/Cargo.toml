[package]
name = "mzlab-filemethod-wasm"
description = "wasm-bindgen bridge of file method (mzlab_core::filemethod: the tandem-MS parameters of a sample and the name/precursor check); a .wasm of its own, loaded on the first request"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
# the same features as the other lazy modules, so a build of all in one cargo run unifies nothing new
mzlab-core = { path = "../mzlab-core", default-features = false, features = ["mappa-dad", "isotopi-tutti"] }
wasm-bindgen = "0.2"
