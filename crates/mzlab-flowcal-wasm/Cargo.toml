[package]
name = "mzlab-flowcal-wasm"
description = "wasm-bindgen bridge of quant.calibrate@1 (mzlab_ops::run::table::quant): a .wasm of its own, loaded by the browser Flow only when this step runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-ops = { path = "../mzlab-ops", features = ["table"] }
wasm-bindgen = "0.2"
