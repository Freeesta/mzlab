[package]
name = "mzlab-rawiso-wasm"
description = "wasm-bindgen bridge of api/rawiso (mzlab_core::rawiso: the M, M+1 and M+2 counts of a peak against a formula, read from the .mzidx); a .wasm of its own, loaded by the worker of the engine on the first request"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
# the same features as the other lazy modules, so a build of all in one cargo run unifies nothing new
mzlab-core = { path = "../mzlab-core", default-features = false, features = ["mappa-dad", "isotopi-tutti"] }
wasm-bindgen = "0.2"
