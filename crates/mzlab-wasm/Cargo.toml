[package]
name = "mzlab-wasm"
description = "wasm-bindgen bridge of mzlab-core; runs ONLY inside a Web Worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
# the Thermo reader (feature `thermo`) is not in the engine: the page loads the `thermo` readers module and the engine reads it through `esterno.rs`
mzlab-core = { path = "../mzlab-core", default-features = false }
wasm-bindgen = "0.2"
