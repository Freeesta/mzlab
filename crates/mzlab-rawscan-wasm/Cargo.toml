[package]
name = "mzlab-rawscan-wasm"
description = "wasm-bindgen bridge of api/rawscan (mzlab_core::rawscan: what is in the spectrum of a time window that is not in the background, read from the .mzidx); a .wasm of its own, loaded by the worker of the engine on the first request"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.106"
# the same features as the other lazy modules, so a build of all in one cargo run unifies nothing new
mzlab-core = { path = "../mzlab-core", default-features = false, features = ["mappa-dad", "isotopi-tutti"] }
wasm-bindgen = "0.2"
