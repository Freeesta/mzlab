[package]
name = "mzlab-ops"
description = "native home of what orchestrates the engines for a transport (runs, ops, virtual file system); plain Rust, no JS dependency, shared by the bridges, the CLI and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mzlab-core = { path = "../mzlab-core" }
# no default features: each bridge picks its own set through the features below, so a .wasm never gets `chem` it did not have
mzlab-feat = { path = "../mzlab-feat", default-features = false }

[features]
# `table`: the modules of `run::table` (they read the rows of the block `interp/1` for the network of the products, `rete`)
table = ["mzlab-feat/interp"]
# the same names as in `mzlab-feat-wasm`, which turns them on with its own: `detect` = `run_estimate`, `proofs` = `state`
detect = ["mzlab-feat/untargeted"]
proofs = []
# `untargeted` = the pipeline after mzmine 3.9.0 (`run::feat::untargeted`)
untargeted = ["mzlab-feat/untargeted"]
