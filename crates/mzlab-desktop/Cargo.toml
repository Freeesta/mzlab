[package]
name = "mzlab-desktop"
description = "mzLab desktop: the same web app in a Tauri window, with a native engine (memory-mapped files) behind the mzlab:// protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "mzlab_desktop"

[[bin]]
name = "mzlab"
path = "src/main.rs"
required-features = ["app"]

[features]
# The window (Tauri). Off by default so that `cargo test` of the workspace needs no webview library.
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[dependencies]
mzlab-core = { path = "../mzlab-core" }
mzlab-lettori = { path = "../mzlab-lettori", features = ["tutte"] }
# mzFinder natively: the same steps and adapter that the .wasm of mzFinder runs (`run`, `legacy`) and the table views of the Pipeline panel
mzlab-feat = { path = "../mzlab-feat", features = ["chem", "untargeted"] }
mzlab-feat-wasm = { path = "../mzlab-feat-wasm", default-features = false, features = ["detect", "proofs", "finder", "untargeted"] }
mzlab-feat-table-wasm = { path = "../mzlab-feat-table-wasm" }
memmap2 = "0.9"
# the builds of the .mzidx of several files run on a thread pool (native only, never in the WASM graph)
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# the only network code of the program: web-part updates from freeesta.github.io (pure Rust TLS; never in the WASM graph)
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
mzlab-lib = { path = "../mzlab-lib" }
