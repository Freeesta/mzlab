<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mzLab - il sito si è spostato</title>
  <meta http-equiv="refresh" content="0; url=https://freeesta.github.io/mzlab/">
  <link rel="canonical" href="https://freeesta.github.io/mzlab/">
  <script>
    // Same page in the new site: keep the rest of the path, the ?query and the #hash.
    // The old service workers (scope under /QqQ-lab/) are unregistered first, so the old cached app does not come back.
    (function () {
      var target = location.pathname.replace(/^\/QqQ-lab/i, "/mzlab") + location.search + location.hash;
      if (!/^\/mzlab/.test(target)) target = "/mzlab/" + location.search + location.hash;
      var go = function () { location.replace(target); };
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.filter(function (r) { return /\/QqQ-lab\//i.test(r.scope); }).map(function (r) { return r.unregister(); }));
          }).then(go, go);
          setTimeout(go, 1500);
        } else go();
      } catch (e) { go(); }
    })();
  </script>
</head>
<body>
  <p>Il sito si è spostato: <a href="https://freeesta.github.io/mzlab/">https://freeesta.github.io/mzlab/</a></p>
</body>
</html>
