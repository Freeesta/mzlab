# Lab site of mzLab (copy of this file to .github/workflows/pages.yml in Freeesta/qqq; see tools/lab/README.md in Freeesta/mzlab).
# Checks out Freeesta/mzlab main every day, builds it with the lab variant (only Data and Draw, expires on the date below) and publishes it.
# Same build steps as .github/workflows/pages.yml of mzlab. One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: pages

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MZLAB_LAB: "1"
  MZLAB_LAB_EXPIRES: "2026-12-29"

# No run is ever cancelled: a running build/deploy finishes (the site always gets a new version), and of the runs waiting
# GitHub keeps only the newest, so quick merges in a row end in one more deploy of the last commit, never in none.
# The group is on the whole workflow: the parallel jobs of two runs never overlap. A branch run (workflow_dispatch) has a group of its own, so it never displaces a run of main.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages-build' || format('pages-build-{0}', github.ref) }}
  cancel-in-progress: false

# The site is built in parallel jobs and put together by `assemble`: `wasm-core` (engine, libraries, readers), `wasm-feat-a` and `wasm-feat-b` (mzFinder, the two halves of tools/build_feat_wasm.sh), `packages` (spectral libraries and suspect index); each hands its static/ subtree over as an artifact.
jobs:

  wasm-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Freeesta/mzlab
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      # the identity of the build for option_env! (prov/1, corsa/1): rustc, SHA-256 of Cargo.lock, target; never the commit, so the .wasm bytes do not change at every commit
      - name: Build identity of the WASM modules
        run: python3 -c 'import sys; sys.path.insert(0, "tools"); import prepara_sito; [print(f"{k}={v}") for k, v in prepara_sito.build_env("wasm32-unknown-unknown", commit=False).items()]' >> "$GITHUB_ENV"
      # every run restores the newest cache of its kind; a new one is saved only when the Rust sources (crates/, vendor/, Cargo.lock) changed: the 10 GB of caches of the repository are not filled by copies of the same build
      - id: rcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-core-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}-m1
          # the cache of this kind first, then the older single cache, so the first run is not cold
          restore-keys: |
            pages-core-${{ runner.os }}-
            pages-rust-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: wasm-bindgen CLI (the version of Cargo.lock)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          wasm-bindgen --version 2>/dev/null | grep -q "$ver" || cargo install wasm-bindgen-cli --version "$ver" --locked --force
      - name: Build the WASM engine, the libraries and the readers (only in the published site, never committed)
        run: |
          mkdir -p site/static
          tools/cargo_wasm.sh build --locked --release --target wasm32-unknown-unknown -p mzlab-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm target/wasm32-unknown-unknown/release/mzlab_wasm.wasm
          tools/wasm_opt.sh site/static/wasm/mzlab_wasm_bg.wasm 2744320 engine @motore
          tools/cargo_wasm.sh build --locked --release --target wasm32-unknown-unknown -p mzlab-lib-wasm
          wasm-bindgen --target web --no-typescript --out-dir site/static/wasm-lib target/wasm32-unknown-unknown/release/mzlab_lib_wasm.wasm
          tools/wasm_opt.sh site/static/wasm-lib/mzlab_lib_wasm_bg.wasm 614400 libraries @motore
          # the readers (8 families, own manifest) build here, not in part b of build_feat_wasm.sh: it evens out the three jobs
          tools/build_lettori_wasm.sh site/static
      - name: Record the tree of the cache
        if: steps.rcache.outputs.cache-hit != 'true'
        run: python3 tools/ci_cargo_mtime.py record
      - name: Save the Rust cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-core
          path: |
            site/static/wasm
            site/static/wasm-lib
            site/static/wasm-lettori
          retention-days: 1

  wasm-feat-a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Freeesta/mzlab
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      # the identity of the build for option_env! (prov/1, corsa/1): rustc, SHA-256 of Cargo.lock, target; never the commit, so the .wasm bytes do not change at every commit
      - name: Build identity of the WASM modules
        run: python3 -c 'import sys; sys.path.insert(0, "tools"); import prepara_sito; [print(f"{k}={v}") for k, v in prepara_sito.build_env("wasm32-unknown-unknown", commit=False).items()]' >> "$GITHUB_ENV"
      # every run restores the newest cache of its kind; a new one is saved only when the Rust sources (crates/, vendor/, Cargo.lock) changed: the 10 GB of caches of the repository are not filled by copies of the same build
      - id: rcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-feat-a-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}-m1
          # the cache of this kind first, then the older single cache, so the first run is not cold
          restore-keys: |
            pages-feat-a-${{ runner.os }}-
            pages-rust-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: wasm-bindgen CLI (the version of Cargo.lock)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          wasm-bindgen --version 2>/dev/null | grep -q "$ver" || cargo install wasm-bindgen-cli --version "$ver" --locked --force
      - name: Build the mzFinder WASM engines, part a (the .wasm of their own, under 500 KB each; the manifest is written by `assemble`; never committed)
        run: |
          mkdir -p site/static
          tools/build_feat_wasm.sh site/static a
      - name: Record the tree of the cache
        if: steps.rcache.outputs.cache-hit != 'true'
        run: python3 tools/ci_cargo_mtime.py record
      - name: Save the Rust cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-feat-a
          # a single path would drop its own name from the artifact: site/static holds only wasm-feat here, so the prefix stays
          path: site/static
          retention-days: 1

  wasm-feat-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Freeesta/mzlab
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      # the identity of the build for option_env! (prov/1, corsa/1): rustc, SHA-256 of Cargo.lock, target; never the commit, so the .wasm bytes do not change at every commit
      - name: Build identity of the WASM modules
        run: python3 -c 'import sys; sys.path.insert(0, "tools"); import prepara_sito; [print(f"{k}={v}") for k, v in prepara_sito.build_env("wasm32-unknown-unknown", commit=False).items()]' >> "$GITHUB_ENV"
      # every run restores the newest cache of its kind; a new one is saved only when the Rust sources (crates/, vendor/, Cargo.lock) changed: the 10 GB of caches of the repository are not filled by copies of the same build
      - id: rcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: pages-feat-b-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('crates/**', 'vendor/**', '.cargo/**') }}-m1
          # the cache of this kind first, then the older single cache, so the first run is not cold
          restore-keys: |
            pages-feat-b-${{ runner.os }}-
            pages-rust-${{ runner.os }}-
      # cargo rebuilds a crate whose source mtime is newer than its cached output, and a checkout touches every file: restore the old mtime of the unchanged ones (tools/ci_cargo_mtime.py)
      - id: mtime
        name: Reuse the compiled crates of the cache
        run: python3 tools/ci_cargo_mtime.py restore
      - name: wasm-bindgen CLI (the version of Cargo.lock)
        run: |
          ver=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          wasm-bindgen --version 2>/dev/null | grep -q "$ver" || cargo install wasm-bindgen-cli --version "$ver" --locked --force
      - name: Build the mzFinder WASM engines, part b (the .wasm of their own, under 500 KB each; the manifest is written by `assemble`; never committed)
        run: |
          mkdir -p site/static
          tools/build_feat_wasm.sh site/static b
      - name: Record the tree of the cache
        if: steps.rcache.outputs.cache-hit != 'true'
        run: python3 tools/ci_cargo_mtime.py record
      - name: Save the Rust cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rcache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ steps.rcache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-feat-b
          # a single path would drop its own name from the artifact: site/static holds only wasm-feat here, so the prefix stays
          path: site/static
          retention-days: 1

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Freeesta/mzlab
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # the builder of the packages is a native example of mzlab-lib: cargo builds it when the cache of the packages is cold
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - run: mkdir -p site/static
      - name: Restore the spectral-library packages from the cache (pinned MassBank release, built with the Rust builder, never committed)
        id: libcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/librerie
          key: librerie-${{ hashFiles('tools/librerie_pacchetti.py', 'tools/librerie_catalogo.json', 'crates/mzlab-lib/src/**', 'tests/golden/librerie/massbank_unito/**') }}
      # The pinned downloads (MassBank 240 MB, the suspect sources 330 MB; 10-25 minutes from Zenodo) are kept in a cache of their own,
      # keyed by their pinned SHA-256: a new builder or a new package format rebuilds from the cached files in about a minute.
      - name: Keys of the pinned downloads (their SHA-256 in tools/librerie_pacchetti.py and tools/genera_sospetti.py)
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, sys
          sys.path.insert(0, "tools")
          import librerie_pacchetti as l, genera_sospetti as g
          print("massbank=" + l.ZIP_SHA256[:20])
          print("fonti=" + hashlib.sha256(" ".join(h for s in g.SOURCES for _, h, _ in s["files"]).encode()).hexdigest()[:20])
          PY
      - name: Restore the MassBank download
        if: steps.libcache.outputs.cache-hit != 'true'
        id: mbcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .massbank-cache
          key: massbank-zip-${{ steps.pin.outputs.massbank }}
      - name: Build the packages and the catalog (a network failure only warns, the site is published without packages)
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          # the zip is checked against the pinned SHA-256 here (librerie_pacchetti.py --zip does not check it); a wrong one stops the build
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import librerie_pacchetti as l
          z = Path(".massbank-cache/massbank.zip")
          z.parent.mkdir(exist_ok=True)
          if z.is_file() and l.sha256_file(z) != l.ZIP_SHA256:
              sys.exit("cached MassBank zip: wrong SHA-256, build stopped")
          if not z.is_file():
              print(f"downloading MassBank-data {l.VERSION} (Zenodo {l.ZENODO_RECORD})")
              try:
                  l.download(l.ZIP_URL, z, l.ZIP_SHA256)
              except ConnectionError as e:
                  z.unlink(missing_ok=True)
                  print(f"::warning::spectral-library packages not built: the download failed ({e})")
          PY
          if [ -f .massbank-cache/massbank.zip ]; then
            python tools/librerie_pacchetti.py --out site/static/librerie --zip .massbank-cache/massbank.zip
          fi
      - name: Save the MassBank download
        if: steps.libcache.outputs.cache-hit != 'true' && steps.mbcache.outputs.cache-hit != 'true' && hashFiles('.massbank-cache/massbank.zip') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .massbank-cache
          key: massbank-zip-${{ steps.pin.outputs.massbank }}
      - name: Save the packages in the cache
        if: steps.libcache.outputs.cache-hit != 'true' && hashFiles('site/static/librerie/catalogo.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/librerie
          key: librerie-${{ hashFiles('tools/librerie_pacchetti.py', 'tools/librerie_catalogo.json', 'crates/mzlab-lib/src/**', 'tests/golden/librerie/massbank_unito/**') }}
      - name: Restore the suspect index from the cache (pinned CC BY sources, never committed)
        id: suscache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/mzfinder/sospetti
          key: sospetti-${{ hashFiles('tools/genera_sospetti.py') }}
      - name: Restore the suspect sources
        if: steps.suscache.outputs.cache-hit != 'true'
        id: fonticache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sospetti-fonti
          key: sospetti-fonti-${{ steps.pin.outputs.fonti }}
      # genera_sospetti.py checks every file of --fonte against its pinned SHA-256 and downloads only the missing ones
      - name: Build the suspect index of mzFinder (pinned CC BY sources, never committed; a network failure only warns)
        if: steps.suscache.outputs.cache-hit != 'true'
        run: python tools/genera_sospetti.py --fonte .sospetti-fonti --pacchetto site/static/mzfinder/sospetti
      - name: Save the suspect sources
        if: steps.suscache.outputs.cache-hit != 'true' && steps.fonticache.outputs.cache-hit != 'true' && hashFiles('site/static/mzfinder/sospetti/catalogo.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sospetti-fonti
          key: sospetti-fonti-${{ steps.pin.outputs.fonti }}
      - name: Save the suspect index in the cache
        if: steps.suscache.outputs.cache-hit != 'true' && hashFiles('site/static/mzfinder/sospetti/catalogo.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/mzfinder/sospetti
          key: sospetti-${{ hashFiles('tools/genera_sospetti.py') }}
      # the regulatory lists are committed text (normative/): packed natively, no network; the package is data downloaded on a click, never code in a .wasm
      - name: Restore the regulatory-list package from the cache
        id: normcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/normative
          key: normative-${{ hashFiles('normative/lists/**', 'normative/provenance.json', 'crates/mzlab-cli/src/normative/**', 'crates/mzlab-feat/src/suspects.rs', 'Cargo.lock') }}
      - name: Pack the regulatory lists (mzlab-cli normative pack, no network)
        if: steps.normcache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release -p mzlab-cli
          target/release/mzlab-cli normative pack normative/ site/static/normative/
      - name: Save the regulatory-list package in the cache
        if: steps.normcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/normative
          key: normative-${{ hashFiles('normative/lists/**', 'normative/provenance.json', 'crates/mzlab-cli/src/normative/**', 'crates/mzlab-feat/src/suspects.rs', 'Cargo.lock') }}
      # the in-silico candidates are the PubChemLite structures in mass-range pieces, packed natively; downloaded by the user on a click, never code in a .wasm
      - name: Restore the in-silico candidate package from the cache
        id: inscache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/insilico
          key: insilico-${{ steps.pin.outputs.fonti }}-${{ hashFiles('crates/mzlab-cli/src/insilico_pack.rs', 'crates/mzlab-feat/src/flow_insilico.rs', 'crates/mzlab-feat/src/attributio/ms2_engine/insilico.rs', 'tools/pubchemlite_pacchetto.py', 'Cargo.lock') }}
      - name: Restore the PubChemLite CSV
        if: steps.inscache.outputs.cache-hit != 'true'
        id: inscsv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .insilico-fonti
          key: insilico-fonti-${{ steps.pin.outputs.fonti }}
      - name: Pack the in-silico candidates (mzlab-cli insilico pack; a network failure only warns)
        if: steps.inscache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --release -p mzlab-cli
          python tools/pubchemlite_pacchetto.py --fonte .insilico-fonti --cli target/release/mzlab-cli --out site/static/insilico
      - name: Save the PubChemLite CSV
        if: steps.inscache.outputs.cache-hit != 'true' && steps.inscsv.outputs.cache-hit != 'true' && hashFiles('site/static/insilico/catalogo.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .insilico-fonti
          key: insilico-fonti-${{ steps.pin.outputs.fonti }}
      - name: Save the in-silico candidate package in the cache
        if: steps.inscache.outputs.cache-hit != 'true' && hashFiles('site/static/insilico/catalogo.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/static/insilico
          key: insilico-${{ steps.pin.outputs.fonti }}-${{ hashFiles('crates/mzlab-cli/src/insilico_pack.rs', 'crates/mzlab-feat/src/flow_insilico.rs', 'crates/mzlab-feat/src/attributio/ms2_engine/insilico.rs', 'tools/pubchemlite_pacchetto.py', 'Cargo.lock') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-packages
          # site/static holds only librerie, normative, insilico and mzfinder/sospetti here, so the prefix stays
          path: site/static
          if-no-files-found: ignore
          retention-days: 1

  assemble:
    needs: [wasm-core, wasm-feat-a, wasm-feat-b, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Freeesta/mzlab
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # build.json names the rustc of the pinned toolchain
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show
      - name: Build the site
        run: python tools/build_site.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pages-*
          path: parts
          merge-multiple: true
      - name: Put the parts into the site, then the manifest of mzFinder (it needs both halves)
        run: |
          cp -r parts/. site/static/
          tools/build_feat_wasm.sh site/static manifest
      - name: Record the .wasm modules in static/build.json (they are in place now)
        run: python3 tools/build_site.py --build-json
      # the built modules, for .github/workflows/metriche.yml (sizes per commit, measured off this critical path; small, kept 1 day)
      - name: .wasm modules for the metrics
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metriche-wasm
          path: site/static/**/*.wasm
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: assemble
    # a branch (workflow_dispatch to try the workflow) builds but never publishes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
