[workspace]
resolver = "2"
members = ["crates/mzlab-core", "crates/mzlab-wasm", "crates/mzlab-desktop", "crates/mzlab-lib", "crates/mzlab-lib-wasm", "crates/mzlab-feat", "crates/mzlab-feat-wasm", "crates/mzlab-feat-table-wasm", "crates/mzlab-feat-grafo-wasm", "crates/mzlab-feat-import-wasm", "crates/mzlab-finder-lr-wasm", "crates/mzlab-lettori", "crates/mzlab-lettori-wasm"]
exclude = ["vendor/opentfraw"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Freeesta/mzlab"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
