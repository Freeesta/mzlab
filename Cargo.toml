[workspace]
resolver = "2"
members = ["crates/mzlab-core", "crates/mzlab-wasm", "crates/mzlab-desktop", "crates/mzlab-lib", "crates/mzlab-lib-wasm", "crates/mzlab-feat", "crates/mzlab-feat-wasm", "crates/mzlab-feat-table-wasm", "crates/mzlab-feat-grafo-wasm", "crates/mzlab-feat-import-wasm", "crates/mzlab-attributio-wasm", "crates/mzlab-finder-lr-wasm", "crates/mzlab-lettori", "crates/mzlab-lettori-wasm", "crates/mzlab-cli", "crates/mzlab-chem", "crates/mzlab-chem-wasm", "crates/mzlab-target", "crates/mzlab-mol", "crates/mzlab-libro", "crates/mzlab-libro-wasm", "crates/mzlab-tutor", "crates/mzlab-llm", "crates/mzlab-llm-wasm", "crates/mzlab-msngrafo-wasm", "crates/mzlab-msnregole-wasm"]
exclude = ["vendor/opentfraw"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Freeesta/mzlab"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

# Hot crates of the .wasm builds at opt-level 3 (reading, indexing and peaks 1.4-2.8x faster; the rest of the code stays at "z"; docs/agenti/wasm-potenziale.md).
[profile.release.package.mzlab-core]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.quick-xml]
opt-level = 3

[profile.release.package.base64]
opt-level = 3

# Desktop app only (`cargo tauri build --features app -- --profile desktop`): speed over size; the .wasm builds keep `release`.
[profile.desktop]
inherits = "release"
opt-level = 3

# The `mzlab-cli` binary for analysis (`cargo build --profile cli -p mzlab-cli`): speed over size; the .wasm builds keep `release`.
[profile.cli]
inherits = "release"
opt-level = 3
